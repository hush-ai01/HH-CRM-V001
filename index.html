      </div>

      <Card className="p-4">
        <div className="flex items-center justify-between mb-3"><div><div className="text-xs text-[#DB8A4E]">Recent activity</div><div className="text-[10px] text-stone-600">Latest changes across the CRM</div></div><button onClick={() => setTab("audit")} className="text-[10px] text-stone-500 hover:text-[#DB8A4E]">Full audit log →</button></div>
        {(data.auditLog || []).length === 0 ? <div className="py-5 text-center text-xs text-stone-600">Activity will appear here as the team adds records.</div> : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">{data.auditLog.slice(0, 6).map((entry) => <div key={entry.id} className="bg-[#202426] rounded-lg p-3"><div className="flex items-center gap-2"><Pill tone={entry.action === "Deleted" ? "red" : entry.action === "Added" ? "green" : "amber"}>{entry.action}</Pill><span className="text-[10px] text-stone-500 truncate">{entry.entity}</span></div><div className="text-xs text-stone-300 mt-2 truncate">{entry.label}</div><div className="text-[9px] text-stone-600 mt-1">{entry.person} · {fmtTime(entry.at)}</div></div>)}</div>}
      </Card>
    </div>
  );
}

/* ---------------- DEALS (Transactions) ---------------- */

function DealsTab({ data, persist, log, withLog, user, users }) {
  const [modal, setModal] = useState(null);
  const [q, setQ] = useState("");
  const [scope, setScope] = useState(isManagement(user) ? "all" : "mine");

  const clientName = (deal) => deal.clientManual || data.clients.find((c) => c.id === deal.clientId)?.name || "—";
  const mineralLabel = (deal) => deal.mineralManual || (() => {
    const m = data.minerals.find((x) => x.id === deal.mineralId);
    return m ? `${m.commodity} · ${m.grade}` : "—";
  })();
  const visibleClients = data.clients.filter((c) => canViewRecord(user, c));
  const visibleClientIds = new Set(visibleClients.map((c) => c.id));
  const accessible = data.deals.filter((d) => canViewRecord(user, d) || (d.clientId && visibleClientIds.has(d.clientId)));
  const scoped = scope === "mine" ? accessible.filter((d) => ownerKey(d) === userKey(user)) : accessible;
  const filtered = scoped.filter((d) => `${clientName(d)} ${mineralLabel(d)} ${d.status} ${d.dealRef || ""}`.toLowerCase().includes(q.toLowerCase()));

  const saveDeal = (form, editing) => {
    let next = { ...data };
    const key = userKey(user);
    if (form.syncInventory && form.mineralManual && Number(form.quantity) > 0) {
      const supplier = data.clients.find((c) => c.id === form.supplierClientId);
      const stockPayload = { commodity: inferCommodity(form.mineralManual), grade: form.promisedGrade || "Not specified", quantity: form.quantity, unit: form.unit || "MT", location: form.manualLocation || "", owner: supplier?.name || form.clientManual || "", washPlant: supplier?.name || "", notes: `Auto-synced from transaction ${form.dealRef || "manual entry"}`, supplierClientId: form.supplierClientId || "", sourceDealId: editing?.id || "", status: "Pipeline / Unconfirmed" };
      if (editing?.inventoryMineralId) {
        next.minerals = next.minerals.map((m) => m.id === editing.inventoryMineralId ? { ...m, ...stockPayload, updatedAt: new Date().toISOString() } : m);
        form = { ...form, inventoryMineralId: editing.inventoryMineralId };
      } else {
        const stock = { ...stockPayload, id: uid("min"), createdAt: new Date().toISOString() };
        next.minerals = [stock, ...next.minerals];
        form = { ...form, inventoryMineralId: stock.id };
      }
    }
    const enriched = editing ? { ...form } : { ...form, createdByUserId: key, originatorUserId: form.originatorUserId || key, ownerUserId: form.ownerUserId || key, visibility: form.visibility || "Private" };
    const label = enriched.dealRef || (editing ? clientName(enriched) : enriched.clientManual) || "New deal";
    const docLogs = logNewDocs(log, editing?.documents, enriched.documents, label, "Deal documents");
    if (editing) {
      next.deals = next.deals.map((d) => (d.id === editing.id ? { ...d, ...enriched, updatedBy: key, updatedAt: new Date().toISOString() } : d));
      next = withLog(next, [log("Edited", "Deal", enriched.dealRef || clientName(enriched)), ...docLogs]);
    } else {
      const deal = { ...enriched, id: uid("deal"), createdAt: new Date().toISOString() };
      if (deal.inventoryMineralId) next.minerals = next.minerals.map((m) => m.id === deal.inventoryMineralId ? { ...m, sourceDealId: deal.id } : m);
      next.deals = [deal, ...next.deals];
      next = withLog(next, [log("Added", "Deal", enriched.dealRef || enriched.clientManual || "New deal"), ...docLogs]);
    }
    persist(next);
    setModal(null);
  };

  const removeDeal = (deal) => {
    if (!isManagement(user)) return alert("Only Management can delete transactions. Ask Management to archive or remove this record.");
    if (!confirmDelete(`deal ${deal.dealRef || clientName(deal)}`)) return;
    let next = { ...data, deals: data.deals.filter((d) => d.id !== deal.id) };
    next = withLog(next, log("Deleted", "Deal", deal.dealRef || clientName(deal)));
    persist(next);
  };

  return (
    <div>
      <PageHeader eyebrow="Ledger" title="Transactions" subtitle="Every trade, tracked from prospect to payment" action={<Btn onClick={() => setModal("add")}><Plus size={14} /> Add Deal</Btn>} />
      <div className="flex flex-col sm:flex-row gap-2 mb-5">
        <div className="relative flex-1"><Search size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500" /><TextInput className="pl-10 py-2.5" placeholder="Search by client, mineral or reference…" value={q} onChange={(e) => setQ(e.target.value)} /></div>
        {isManagement(user) && <div className="flex gap-1 bg-[#1C1F21] border border-[#2B2F32] rounded-lg p-1"><button onClick={() => setScope("mine")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "mine" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>Mine</button><button onClick={() => setScope("all")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "all" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>All</button></div>}
      </div>
      {filtered.length === 0 && <EmptyState label={scope === "mine" ? "No transactions in your book yet." : "No transactions yet."} />}
      <div className="space-y-2.5">
        {filtered.map((d) => (
          <Card key={d.id} className="p-4">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="text-sm font-medium text-stone-100">{clientName(d)}</div>
                <div className="text-xs text-stone-400">{mineralLabel(d)}</div>
                <div className="text-xs text-stone-500 mt-1">{d.quantity ? `${d.quantity} ${d.unit || "MT"}` : ""} {(d.sellingPrice || d.price) ? `· ${d.currency || "$"}${d.sellingPrice || d.price}/${d.unit || "MT"}` : ""}{d.frequency && d.frequency !== "Once-off" ? ` · ${d.frequency === "Other" ? (d.frequencyOther || "Other") : d.frequency}` : ""}</div>
                <div className="text-[10px] text-stone-600 mt-1">Owner: {userNameByKey(users, d.ownerUserId || d.originatorUserId)}{d.originatorUserId && d.originatorUserId !== d.ownerUserId ? ` · Originated by ${userNameByKey(users, d.originatorUserId)}` : ""}</div>
                <div className="flex flex-wrap gap-2 mt-2 text-[10px]">
                  {isManagement(user) && d.expectedGrossProfit !== undefined && d.expectedGrossProfit !== "" && <span className="px-2 py-1 rounded bg-[#7C9885]/10 text-[#A7C1AE] border border-[#7C9885]/25">Expected GP {fmtMoney(d.currency, d.expectedGrossProfit)}{d.expectedMargin !== "" && d.expectedMargin !== undefined ? ` · ${Number(d.expectedMargin).toFixed(1)}%` : ""}</span>}
                  {d.expectedCommission !== undefined && d.expectedCommission !== "" && <span className="px-2 py-1 rounded bg-[#C9763C]/10 text-[#E7A874] border border-[#C9763C]/25">Commission {fmtMoney(d.currency, d.expectedCommission)}</span>}
                </div>
              </div>
              <div className="flex flex-col items-end gap-1"><Pill tone={["Delivered", "Testing", "Payment 1", "Paid"].includes(d.status) ? "green" : d.status === "On Hold" ? "red" : "amber"}>{d.status === "Other" ? d.statusOther || "Other" : dealStageLabel(d.status, d)}</Pill><div className="flex gap-1 mt-1"><button onClick={() => setModal(d)} title="Edit deal" className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>{isManagement(user) && <button onClick={() => removeDeal(d)} title="Delete deal" className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>}</div></div>
            </div>
            {(d.buyerClientId || d.supplierClientId || d.tradeOutcome || d.fulfilmentPct !== "" && d.fulfilmentPct !== undefined) && <div className="mt-3 rounded-lg bg-[#181B1D] border border-[#2B2F32] px-3 py-2">
              <div className="text-[9px] uppercase tracking-[0.12em] text-[#DB8A4E] mb-1.5">Trade intelligence</div>
              <div className="flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-stone-500">
                {d.buyerClientId && <span>Buyer: <strong className="text-stone-300">{data.clients.find((c) => c.id === d.buyerClientId)?.name || "Linked"}</strong></span>}
                {d.supplierClientId && <span>Supplier: <strong className="text-stone-300">{data.clients.find((c) => c.id === d.supplierClientId)?.name || "Linked"}</strong></span>}
                {d.fulfilmentPct !== "" && d.fulfilmentPct !== undefined && <span>Fulfilment: <strong className="text-stone-300">{Number(d.fulfilmentPct).toFixed(1)}%</strong></span>}
                {d.actualPaymentDays !== "" && d.actualPaymentDays !== undefined && <span>Paid in: <strong className="text-stone-300">{d.actualPaymentDays}d</strong></span>}
                {d.tradeOutcome && d.tradeOutcome !== "Open" && <span>Outcome: <strong className="text-stone-300">{d.tradeOutcome}</strong></span>}
                {isManagement(user) && d.actualGrossProfit !== "" && d.actualGrossProfit !== undefined && <span>Actual GP: <strong className="text-[#A7C1AE]">{fmtMoney(d.currency, d.actualGrossProfit)}</strong></span>}
              </div>
            </div>}
            {(d.documents || []).length > 0 && <div className="mt-2 flex flex-wrap gap-1">{d.documents.map((f, i) => <span key={i} className="text-[10px] bg-[#202426] border border-[#2B2F32] px-1.5 py-0.5 rounded flex items-center gap-1 text-stone-400"><Paperclip size={10} /> {f.name}</span>)}</div>}
            {DEAL_FLOW_STAGES.includes(d.status) && <div className="mt-3 pt-3 border-t border-[#2B2F32]"><Stepper stages={DEAL_FLOW_STAGES.map((x) => dealStageLabel(x, d))} currentIndex={DEAL_FLOW_STAGES.indexOf(d.status)} /></div>}
          </Card>
        ))}
      </div>
      {modal && <DealModal data={data} visibleClients={visibleClients} user={user} users={users} persist={persist} log={log} withLog={withLog} editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={saveDeal} />}
    </div>
  );
}

function DealModal({ data, visibleClients, user, users, persist, log, withLog, editing, onClose, onSave }) {
  const [clientMode, setClientMode] = useState(editing?.clientManual ? "manual" : "select");
  const [clientId, setClientId] = useState(editing?.clientId || "");
  const [clientManual, setClientManual] = useState(editing?.clientManual || "");
  const [mineralMode, setMineralMode] = useState(editing?.mineralManual ? "manual" : "select");
  const [mineralId, setMineralId] = useState(editing?.mineralId || "");
  const [mineralManual, setMineralManual] = useState(editing?.mineralManual || "");
  const [manualLocation, setManualLocation] = useState(editing?.manualLocation || "");
  const [syncInventory, setSyncInventory] = useState(editing?.syncInventory ?? true);
  const [quantity, setQuantity] = useState(editing?.quantity || "");
  const [unit, setUnit] = useState(editing?.unit || "MT");
  const [frequency, setFrequency] = useState(editing?.frequency || DEAL_FREQUENCIES[0]);
  const [frequencyOther, setFrequencyOther] = useState(editing?.frequencyOther || "");
  const [sellingPrice, setSellingPrice] = useState(editing?.sellingPrice || editing?.price || "");
  const [purchasePrice, setPurchasePrice] = useState(editing?.purchasePrice || "");
  const [estimatedLogisticsCost, setEstimatedLogisticsCost] = useState(editing?.estimatedLogisticsCost || "");
  const [currency, setCurrency] = useState(editing?.currency || "R");
  const [commissionType, setCommissionType] = useState(editing?.commissionType || COMMISSION_TYPES[0]);
  const [commissionRate, setCommissionRate] = useState(editing?.commissionRate || "");
  // Highlands Trade Graph / moat-capture fields. Additive: the original deal fields remain untouched.
  const [buyerClientId, setBuyerClientId] = useState(editing?.buyerClientId || (editing?.clientId && data.clients.find((c) => c.id === editing.clientId)?.type === "Buyer" ? editing.clientId : ""));
  const [supplierClientId, setSupplierClientId] = useState(editing?.supplierClientId || (editing?.clientId && data.clients.find((c) => c.id === editing.clientId)?.type === "Supplier" ? editing.clientId : ""));
  const [promisedGrade, setPromisedGrade] = useState(editing?.promisedGrade || "");
  const [expectedDeliveryDate, setExpectedDeliveryDate] = useState(editing?.expectedDeliveryDate || "");
  const [paymentTermsDays, setPaymentTermsDays] = useState(editing?.paymentTermsDays || "");
  const [paymentFirstPct, setPaymentFirstPct] = useState(editing?.paymentFirstPct ?? 70);
  const paymentBalancePct = Math.max(0, 100 - (Number(paymentFirstPct) || 0));
  const linkedTrips = editing?.id ? (data.trips || []).filter((t) => t.dealId === editing.id) : [];
  const tripDeliveredQty = linkedTrips.reduce((sum, t) => sum + ((Number(t.netWeight) || 0) * (t.moisturePct ? 1 - Number(t.moisturePct) / 100 : 1)), 0);
  const [actualQuantity, setActualQuantity] = useState(editing?.actualQuantity || "");
  const [actualGrade, setActualGrade] = useState(editing?.actualGrade || "");
  const [actualMoisturePct, setActualMoisturePct] = useState(editing?.actualMoisturePct || "");
  const [actualDeliveryDate, setActualDeliveryDate] = useState(editing?.actualDeliveryDate || "");
  const [actualSellingPrice, setActualSellingPrice] = useState(editing?.actualSellingPrice || "");
  const [actualPurchasePrice, setActualPurchasePrice] = useState(editing?.actualPurchasePrice || "");
  const [actualLogisticsCost, setActualLogisticsCost] = useState(editing?.actualLogisticsCost || "");
  const [actualCommission, setActualCommission] = useState(editing?.actualCommission || "");
  const [actualPaymentDays, setActualPaymentDays] = useState(editing?.actualPaymentDays || "");
  const [tradeOutcome, setTradeOutcome] = useState(editing?.tradeOutcome || "Open");
  const [disputeType, setDisputeType] = useState(editing?.disputeType || "");
  const [repeatTradeIntent, setRepeatTradeIntent] = useState(editing?.repeatTradeIntent || "Unknown");
  const [closeNotes, setCloseNotes] = useState(editing?.closeNotes || "");
  const [status, setStatus] = useState(editing?.status || DEAL_STATUSES[0]);
  const [statusOther, setStatusOther] = useState(editing?.statusOther || "");
  const [dealRef, setDealRef] = useState(editing?.dealRef || "");
  const [notes, setNotes] = useState(editing?.notes || "");
  const [documents, setDocuments] = useState(editing?.documents || []);
  const [quickClientOpen, setQuickClientOpen] = useState(false);

  const selectedClient = clientMode === "select" ? data.clients.find((c) => c.id === clientId) : null;
  const clientIsSupplier = selectedClient && (selectedClient.type === "Supplier" || selectedClient.type === "Both");
  const qty = Number(quantity) || 0, sell = Number(sellingPrice) || 0, buy = Number(purchasePrice) || 0, logisticsPerUnit = Number(estimatedLogisticsCost) || 0;
  const revenue = qty * sell;
  const commission = commissionType === "Fixed" ? (Number(commissionRate) || 0) : commissionType === "Percentage" ? revenue * ((Number(commissionRate) || 0) / 100) : qty * (Number(commissionRate) || 0);
  const gp = purchasePrice === "" ? "" : revenue - (qty * buy) - (qty * logisticsPerUnit) - commission;
  const margin = gp === "" || !revenue ? "" : (Number(gp) / revenue) * 100;

  const actualQty = Number(actualQuantity || (tripDeliveredQty ? tripDeliveredQty.toFixed(2) : 0)) || 0;
  const actualSell = Number(actualSellingPrice) || 0;
  const actualBuy = Number(actualPurchasePrice) || 0;
  const actualLogisticsPerUnit = Number(actualLogisticsCost) || 0;
  const actualRevenue = actualQty * actualSell;
  const actualGp = (actualQuantity || tripDeliveredQty) && actualSellingPrice !== "" && actualPurchasePrice !== ""
    ? actualRevenue - (actualQty * actualBuy) - (actualQty * actualLogisticsPerUnit) - (Number(actualCommission) || 0)
    : "";
  const actualMargin = actualGp === "" || !actualRevenue ? "" : (Number(actualGp) / actualRevenue) * 100;
  const fulfilmentPct = qty && actualQty ? (actualQty / qty) * 100 : "";
  const daysBetween = (a, b) => {
    if (!a || !b) return "";
    const x = new Date(a), y = new Date(b);
    if (Number.isNaN(x.getTime()) || Number.isNaN(y.getTime())) return "";
    return Math.round((y - x) / 86400000);
  };
  const deliveryVarianceDays = daysBetween(expectedDeliveryDate, actualDeliveryDate);
  const paymentVarianceDays = paymentTermsDays !== "" && actualPaymentDays !== "" ? Number(actualPaymentDays) - Number(paymentTermsDays) : "";

  const addQuickClient = (client) => {
    const key = userKey(user);
    const enriched = { ...client, createdByUserId: key, originatorUserId: key, ownerUserId: key, visibility: "Private" };
    const dupe = duplicateRecord(data.clients, enriched, null);
    if (dupe) return alert("This organisation may already exist in Highlands. Ask Management to check the existing account before creating a duplicate.");
    const next = { ...data, clients: [enriched, ...data.clients] };
    persist(withLog(next, log("Added", "Client", enriched.name)));
    setClientId(enriched.id); setClientMode("select"); setQuickClientOpen(false);
  };

  const submit = () => onSave({
    dealRef, clientId: clientMode === "select" ? clientId : "", clientManual: clientMode === "manual" ? clientManual : "",
    mineralId: mineralMode === "select" ? mineralId : "", mineralManual: mineralMode === "manual" ? mineralManual : "", manualLocation, syncInventory, inventoryMineralId: editing?.inventoryMineralId || "",
    quantity, unit, frequency, frequencyOther: frequency === "Other" ? frequencyOther : "", price: sellingPrice, sellingPrice,
    purchasePrice: isManagement(user) ? purchasePrice : (editing?.purchasePrice || ""), estimatedLogisticsCost: isManagement(user) ? estimatedLogisticsCost : (editing?.estimatedLogisticsCost || ""),
    currency, commissionType, commissionRate, expectedCommission: commission ? Number(commission.toFixed(2)) : 0,
    expectedGrossProfit: gp === "" ? "" : Number(Number(gp).toFixed(2)), expectedMargin: margin === "" ? "" : Number(Number(margin).toFixed(2)),
    buyerClientId, supplierClientId, promisedGrade, expectedDeliveryDate, paymentTermsDays, paymentFirstPct: Number(paymentFirstPct) || 0, paymentBalancePct,
    actualQuantity: actualQuantity || (tripDeliveredQty ? Number(tripDeliveredQty.toFixed(2)) : ""),
    actualGrade, actualMoisturePct, actualDeliveryDate,
    actualSellingPrice: isManagement(user) ? actualSellingPrice : (editing?.actualSellingPrice || ""),
    actualPurchasePrice: isManagement(user) ? actualPurchasePrice : (editing?.actualPurchasePrice || ""),
    actualLogisticsCost: isManagement(user) ? actualLogisticsCost : (editing?.actualLogisticsCost || ""),
    actualCommission: isManagement(user) ? actualCommission : (editing?.actualCommission || ""),
    actualRevenue: actualRevenue ? Number(actualRevenue.toFixed(2)) : "",
    actualGrossProfit: isManagement(user) && actualGp !== "" ? Number(Number(actualGp).toFixed(2)) : (editing?.actualGrossProfit || ""),
    actualMargin: isManagement(user) && actualMargin !== "" ? Number(Number(actualMargin).toFixed(2)) : (editing?.actualMargin || ""),
    fulfilmentPct: fulfilmentPct === "" ? "" : Number(Number(fulfilmentPct).toFixed(2)),
    deliveryVarianceDays: deliveryVarianceDays === "" ? "" : deliveryVarianceDays,
    actualPaymentDays, paymentVarianceDays: paymentVarianceDays === "" ? "" : paymentVarianceDays,
    tradeOutcome, disputeType: tradeOutcome === "Disputed" ? disputeType : "", repeatTradeIntent, closeNotes,
    intelligenceUpdatedAt: new Date().toISOString(),
    status, statusOther: status === "Other" ? statusOther : "", notes, documents,
  }, editing);

  return (
    <Modal title={editing ? "Edit Deal" : "Add Deal"} onClose={onClose} wide>
      <Field label="Deal reference (optional)"><TextInput value={dealRef} onChange={(e) => setDealRef(e.target.value)} placeholder="e.g. HC/HL/009/26" /></Field>
      <div className="flex items-center justify-between mb-1"><span className="block text-xs uppercase tracking-wide text-stone-400">Client</span><div className="flex gap-1"><button onClick={() => setClientMode("select")} className={`text-[11px] px-2 py-0.5 rounded-full ${clientMode === "select" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>Choose existing</button><button onClick={() => setClientMode("manual")} className={`text-[11px] px-2 py-0.5 rounded-full ${clientMode === "manual" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>Type manually</button></div></div>
      {clientMode === "select" ? <div className="mb-1"><Select value={clientId} onChange={(e) => setClientId(e.target.value)}><option value="">— select client —</option>{visibleClients.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.type})</option>)}</Select></div> : <TextInput className="mb-1" value={clientManual} onChange={(e) => setClientManual(e.target.value)} placeholder="Client name" />}
      <button onClick={() => setQuickClientOpen(true)} className="text-[11px] text-[#DB8A4E] hover:text-[#E7A874] mb-3 inline-flex items-center gap-1"><Plus size={11} /> Add new client without leaving this deal</button>
      {selectedClient && <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3 text-xs"><div className="text-[#DB8A4E] mb-1.5">Pulled from {selectedClient.name}'s record</div><div className="text-stone-400 mb-1">{selectedClient.area || "No area on file"}{selectedClient.contactName ? ` · ${selectedClient.contactName}` : ""}{selectedClient.contactPhone ? ` · ${selectedClient.contactPhone}` : ""}</div>{clientIsSupplier && (selectedClient.grades || []).length > 0 && <div className="text-stone-500">Can supply: {(selectedClient.grades || []).join(", ")}</div>}</div>}
      <div className="flex items-center justify-between mb-1"><span className="block text-xs uppercase tracking-wide text-stone-400">Mineral / Grade</span><div className="flex gap-1"><button onClick={() => setMineralMode("select")} className={`text-[11px] px-2 py-0.5 rounded-full ${mineralMode === "select" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>From inventory</button><button onClick={() => setMineralMode("manual")} className={`text-[11px] px-2 py-0.5 rounded-full ${mineralMode === "manual" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>Type manually</button></div></div>
      {mineralMode === "select" ? <Select className="mb-3" value={mineralId} onChange={(e) => setMineralId(e.target.value)}><option value="">— select from Minerals inventory —</option>{data.minerals.map((m) => <option key={m.id} value={m.id}>{m.commodity} · {m.grade} · {m.quantity}{m.unit} @ {m.location}</option>)}</Select> : <div className="mb-3"><TextInput value={mineralManual} onChange={(e) => setMineralManual(e.target.value)} placeholder="e.g. Chrome Concentrate 40/42" /><TextInput className="mt-2" value={manualLocation} onChange={(e) => setManualLocation(e.target.value)} placeholder="Stock location e.g. Steelpoort" /><button type="button" onClick={() => setSyncInventory((v) => !v)} className={`mt-2 text-[11px] px-2.5 py-1.5 rounded-lg border ${syncInventory ? "border-[#7C9885]/50 bg-[#7C9885]/10 text-[#A7C1AE]" : "border-[#2B2F32] text-stone-500"}`}>{syncInventory ? "✓ Sync this supply to Supplier Pipeline" : "Sync to Supplier Pipeline"}</button></div>}
      <div className="grid sm:grid-cols-3 gap-2"><Field label="Quantity"><TextInput value={quantity} onChange={(e) => setQuantity(e.target.value)} placeholder="500" /></Field><Field label="Unit"><TextInput value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="MT" /></Field><Field label="Sell price / unit"><div className="flex gap-1"><TextInput className="w-14" value={currency} onChange={(e) => setCurrency(e.target.value)} /><TextInput value={sellingPrice} onChange={(e) => setSellingPrice(e.target.value)} placeholder="3150" /></div></Field></div>
      {isManagement(user) && <div className="grid sm:grid-cols-2 gap-2 bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3"><Field label="Purchase price / unit"><TextInput value={purchasePrice} onChange={(e) => setPurchasePrice(e.target.value)} placeholder="e.g. 2950" /></Field><Field label="Estimated logistics / unit"><TextInput value={estimatedLogisticsCost} onChange={(e) => setEstimatedLogisticsCost(e.target.value)} placeholder="e.g. 80" /></Field></div>}
      <div className="grid sm:grid-cols-2 gap-2"><Field label="Commission basis"><Select value={commissionType} onChange={(e) => setCommissionType(e.target.value)}>{COMMISSION_TYPES.map((x) => <option key={x}>{x}</option>)}</Select></Field><Field label={commissionType === "Percentage" ? "Commission %" : commissionType === "Fixed" ? "Fixed commission" : `Commission / ${unit || "MT"}`}><TextInput value={commissionRate} onChange={(e) => setCommissionRate(e.target.value)} placeholder="0" /></Field></div>
      <div className="grid sm:grid-cols-3 gap-2 mb-3"><div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Revenue</div><div className="text-sm text-stone-100 mt-1">{fmtMoney(currency, revenue)}</div></div><div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Expected commission</div><div className="text-sm text-[#E7A874] mt-1">{fmtMoney(currency, commission)}</div></div>{isManagement(user) && <div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Expected GP</div><div className="text-sm text-[#A7C1AE] mt-1">{gp === "" ? "Add buy price" : `${fmtMoney(currency, gp)}${margin !== "" ? ` · ${margin.toFixed(1)}%` : ""}`}</div></div>}</div>
      <div className="grid sm:grid-cols-2 gap-2"><Field label="Frequency"><Select value={frequency} onChange={(e) => setFrequency(e.target.value)}>{DEAL_FREQUENCIES.map((f) => <option key={f} value={f}>{f}</option>)}</Select></Field>{frequency === "Other" && <Field label="Describe frequency"><TextInput value={frequencyOther} onChange={(e) => setFrequencyOther(e.target.value)} /></Field>}</div>
      <Field label="Status"><Select value={status} onChange={(e) => setStatus(e.target.value)}>{DEAL_STATUSES.map((x) => <option key={x} value={x}>{dealStageLabel(x, { paymentFirstPct, paymentBalancePct })}</option>)}</Select></Field>{status === "Other" && <Field label="Describe status"><TextInput value={statusOther} onChange={(e) => setStatusOther(e.target.value)} /></Field>}

      <div className="mt-4 mb-3 rounded-xl border border-[#C9763C]/30 bg-[#17191A] overflow-hidden">
        <div className="px-4 py-3 border-b border-[#2B2F32]">
          <div className="text-xs uppercase tracking-[0.13em] text-[#DB8A4E]">Highlands Trade Graph</div>
          <div className="text-[11px] text-stone-500 mt-1">Capture the relationship, promise and real-world outcome so every deal improves future decisions.</div>
        </div>
        <div className="p-4">
          <div className="text-[10px] uppercase tracking-wide text-stone-500 mb-2">Trade network & promise</div>
          <div className="grid sm:grid-cols-2 gap-2">
            <Field label="Buyer relationship"><Select value={buyerClientId} onChange={(e) => setBuyerClientId(e.target.value)}><option value="">— optional —</option>{visibleClients.filter((c) => c.type === "Buyer").map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</Select></Field>
            <Field label="Supplier relationship"><Select value={supplierClientId} onChange={(e) => setSupplierClientId(e.target.value)}><option value="">— optional —</option>{visibleClients.filter((c) => c.type === "Supplier").map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</Select></Field>
          </div>
          <div className="grid sm:grid-cols-3 gap-2">
            <Field label="Promised / target grade"><TextInput value={promisedGrade} onChange={(e) => setPromisedGrade(e.target.value)} placeholder="e.g. 40–42%" /></Field>
            <Field label="Expected delivery date"><TextInput type="date" value={expectedDeliveryDate} onChange={(e) => setExpectedDeliveryDate(e.target.value)} /></Field>
            <Field label="Payment terms (days)"><TextInput value={paymentTermsDays} onChange={(e) => setPaymentTermsDays(e.target.value)} placeholder="e.g. 7" /></Field>
            <Field label="First payment %"><TextInput value={paymentFirstPct} onChange={(e) => setPaymentFirstPct(e.target.value)} placeholder="70" /></Field>
            <div className="bg-[#202426] rounded-lg p-3 mb-3"><div className="text-[9px] uppercase text-stone-600">Payment split</div><div className="text-sm text-stone-100 mt-1">{Number(paymentFirstPct) || 0}% / {paymentBalancePct}%</div><div className="text-[10px] text-stone-500 mt-1">Tracker: Testing → {Number(paymentFirstPct) || 0}% Paid → final balance</div></div>
          </div>

          <div className="mt-4 pt-4 border-t border-[#2B2F32] text-[10px] uppercase tracking-wide text-stone-500 mb-2">Actual execution & outcome</div>
          {tripDeliveredQty > 0 && <div className="mb-3 rounded-lg bg-[#202426] border border-[#2B2F32] px-3 py-2 text-[11px] text-stone-400">Linked trips currently indicate <strong className="text-stone-200">{tripDeliveredQty.toFixed(2)} {unit || "MT"}</strong> moisture-adjusted delivered quantity. Leave Actual Quantity blank to use this value when saving.</div>}
          <div className="grid sm:grid-cols-3 gap-2">
            <Field label="Actual quantity"><TextInput value={actualQuantity} onChange={(e) => setActualQuantity(e.target.value)} placeholder={tripDeliveredQty ? tripDeliveredQty.toFixed(2) : "Delivered quantity"} /></Field>
            <Field label="Actual grade"><TextInput value={actualGrade} onChange={(e) => setActualGrade(e.target.value)} placeholder="Final assay grade" /></Field>
            <Field label="Actual moisture %"><TextInput value={actualMoisturePct} onChange={(e) => setActualMoisturePct(e.target.value)} placeholder="e.g. 4.8" /></Field>
          </div>
          <div className="grid sm:grid-cols-3 gap-2">
            <Field label="Actual delivery date"><TextInput type="date" value={actualDeliveryDate} onChange={(e) => setActualDeliveryDate(e.target.value)} /></Field>
            <Field label="Actual payment days"><TextInput value={actualPaymentDays} onChange={(e) => setActualPaymentDays(e.target.value)} placeholder="Days until paid" /></Field>
            <Field label="Repeat-trade outlook"><Select value={repeatTradeIntent} onChange={(e) => setRepeatTradeIntent(e.target.value)}>{REPEAT_TRADE_INTENT.map((x) => <option key={x}>{x}</option>)}</Select></Field>
          </div>
          {isManagement(user) && <>
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
              <Field label="Actual sell / unit"><TextInput value={actualSellingPrice} onChange={(e) => setActualSellingPrice(e.target.value)} placeholder="Final sell price" /></Field>
              <Field label="Actual buy / unit"><TextInput value={actualPurchasePrice} onChange={(e) => setActualPurchasePrice(e.target.value)} placeholder="Final buy price" /></Field>
              <Field label="Actual logistics / unit"><TextInput value={actualLogisticsCost} onChange={(e) => setActualLogisticsCost(e.target.value)} placeholder="Final logistics" /></Field>
              <Field label="Actual commission"><TextInput value={actualCommission} onChange={(e) => setActualCommission(e.target.value)} placeholder="Total commission" /></Field>
            </div>
            <div className="grid sm:grid-cols-4 gap-2 mb-3">
              <div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Fulfilment</div><div className="text-sm text-stone-100 mt-1">{fulfilmentPct === "" ? "—" : `${fulfilmentPct.toFixed(1)}%`}</div></div>
              <div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Actual GP</div><div className="text-sm text-[#A7C1AE] mt-1">{actualGp === "" ? "Complete actual prices" : fmtMoney(currency, actualGp)}</div></div>
              <div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Delivery variance</div><div className="text-sm text-stone-100 mt-1">{deliveryVarianceDays === "" ? "—" : `${deliveryVarianceDays > 0 ? "+" : ""}${deliveryVarianceDays} day(s)`}</div></div>
              <div className="bg-[#202426] rounded-lg p-3"><div className="text-[9px] uppercase text-stone-600">Payment variance</div><div className="text-sm text-stone-100 mt-1">{paymentVarianceDays === "" ? "—" : `${paymentVarianceDays > 0 ? "+" : ""}${paymentVarianceDays} day(s)`}</div></div>
            </div>
          </>}
          <div className="grid sm:grid-cols-2 gap-2">
            <Field label="Trade outcome"><Select value={tradeOutcome} onChange={(e) => setTradeOutcome(e.target.value)}>{TRADE_OUTCOMES.map((x) => <option key={x}>{x}</option>)}</Select></Field>
            {tradeOutcome === "Disputed" && <Field label="Dispute type / issue"><TextInput value={disputeType} onChange={(e) => setDisputeType(e.target.value)} placeholder="Quality, quantity, payment, delivery…" /></Field>}
          </div>
          <Field label="Close / outcome notes"><TextArea rows={2} value={closeNotes} onChange={(e) => setCloseNotes(e.target.value)} placeholder="What was promised, what changed, and what should Highlands remember next time?" /></Field>
        </div>
      </div>

      <Field label="Internal notes"><TextArea rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
      <UploadArea label="Attach documents (assay reports, contracts, photos)" files={documents} onAdd={(fs) => setDocuments((d) => [...d, ...fs])} onRemove={(i) => setDocuments((d) => d.filter((_, idx) => idx !== i))} />
      <div className="flex justify-end gap-2 mt-3"><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn onClick={submit}>{editing ? "Save changes" : "Add deal"}</Btn></div>
      {quickClientOpen && <QuickAddClient onClose={() => setQuickClientOpen(false)} onSave={addQuickClient} />}
    </Modal>
  );
}

function QuickAddClient({ onClose, onSave }) {
  const [name, setName] = useState(""); const [type, setType] = useState(CLIENT_TYPES[0]); const [area, setArea] = useState("");
  return <Modal title="Quick-add client" onClose={onClose}><Field label="Name"><TextInput value={name} onChange={(e) => setName(e.target.value)} /></Field><Field label="Type"><Select value={type} onChange={(e) => setType(e.target.value)}>{CLIENT_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></Field><Field label="Area"><TextInput value={area} onChange={(e) => setArea(e.target.value)} /></Field><div className="flex justify-end gap-2"><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn disabled={!name.trim()} onClick={() => onSave({ id: uid("client"), name: name.trim(), type, area, grades: [], docs: [], kyc: [], createdAt: new Date().toISOString() })}>Add client</Btn></div></Modal>;
}

function EmptyState({ label }) {
  return <div className="text-center text-sm text-stone-600 py-10 border border-dashed border-[#2B2F32] rounded-xl">{label}</div>;
}

function PageHeader({ eyebrow, title, subtitle, action }) {
  return (
    <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-6">
      <div className="min-w-0">
        {eyebrow && <div className="font-display text-[11px] text-[#DB8A4E] tracking-[0.18em] mb-2">{eyebrow}</div>}
        <h1 className="text-[26px] sm:text-[30px] leading-tight font-semibold text-stone-100 mb-1.5" style={{ fontFamily: "'Inter', sans-serif" }}>{title}</h1>
        {subtitle && <p className="text-sm text-stone-500 max-w-xl">{subtitle}</p>}
      </div>
      {action && <div className="flex-shrink-0 sm:mt-1 [&>button]:w-full sm:[&>button]:w-auto">{action}</div>}
    </div>
  );
}

function ActivityModal({ recordName, onClose, onSave }) {
  const [type, setType] = useState(ACTIVITY_TYPES[0]);
  const [outcome, setOutcome] = useState("");
  const [notes, setNotes] = useState("");
  const [nextAction, setNextAction] = useState("");
  const [nextActionAt, setNextActionAt] = useState("");
  return (
    <Modal title={`Log Activity · ${recordName}`} onClose={onClose}>
      <Field label="Activity type"><Select value={type} onChange={(e) => setType(e.target.value)}>{ACTIVITY_TYPES.map((x) => <option key={x}>{x}</option>)}</Select></Field>
      <Field label="Outcome"><TextInput value={outcome} onChange={(e) => setOutcome(e.target.value)} placeholder="e.g. Buyer requested revised pricing" /></Field>
      <Field label="Internal notes"><TextArea rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3"><div className="text-xs text-[#DB8A4E] mb-2">Next action</div><Field label="What happens next?"><TextInput value={nextAction} onChange={(e) => setNextAction(e.target.value)} placeholder="e.g. Send revised offer" /></Field><Field label="Due"><TextInput type="datetime-local" value={nextActionAt} onInput={(e) => setNextActionAt(e.target.value)} onChange={(e) => setNextActionAt(e.target.value)} /></Field></div>
      <div className="flex justify-end gap-2"><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn onClick={() => onSave({ type, outcome, notes, nextAction, nextActionAt })}>Save activity</Btn></div>
    </Modal>
  );
}

/* ---------------- CLIENTS ---------------- */

function ClientsTab({ data, persist, log, withLog, user, users }) {
  const [modal, setModal] = useState(null);
  const [activityTarget, setActivityTarget] = useState(null);
  const [q, setQ] = useState("");
  const [scope, setScope] = useState(isManagement(user) ? "all" : "mine");

  const accessible = data.clients.filter((c) => canViewRecord(user, c));
  const scoped = scope === "mine" ? accessible.filter((c) => ownerKey(c) === userKey(user)) : accessible;
  const filtered = scoped.filter((c) => `${c.name} ${c.area} ${c.type} ${c.contactName || ""} ${c.contactPhone || ""} ${c.contactEmail || ""}`.toLowerCase().includes(q.toLowerCase()));

  const saveClient = (form, editing) => {
    const dupe = duplicateRecord(data.clients, form, editing?.id);
    if (dupe) return alert("This organisation may already exist in Highlands. Ask Management to check the existing account before creating a duplicate.");
    let next = { ...data };
    const key = userKey(user);
    const enriched = editing
      ? { ...form }
      : { ...form, createdByUserId: key, originatorUserId: key, ownerUserId: form.ownerUserId || key, visibility: form.visibility || "Private", accountStatus: form.accountStatus || "Prospect" };
    const docLogs = [
      ...logNewDocs(log, editing?.docs, enriched.docs, enriched.name, "Client documents"),
      ...logNewDocs(log, editing?.kyc, enriched.kyc, enriched.name, "Client KYC"),
    ];
    if (editing) {
      next.clients = next.clients.map((c) => (c.id === editing.id ? { ...c, ...enriched } : c));
      next = withLog(next, [log("Edited", "Client", enriched.name), ...docLogs]);
    } else {
      const client = { ...enriched, id: uid("client"), createdAt: new Date().toISOString() };
      next.clients = [client, ...next.clients];
      next = withLog(next, [log("Added", "Client", enriched.name), ...docLogs]);
    }
    persist(next);
    setModal(null);
  };

  const removeClient = (c) => {
    if (!isManagement(user)) return alert("Only Management can delete client records. Use account status instead.");
    if (!confirmDelete(`client ${c.name}`)) return;
    let next = { ...data, clients: data.clients.filter((x) => x.id !== c.id) };
    next = withLog(next, log("Deleted", "Client", c.name));
    persist(next);
  };

  const saveActivity = (form) => {
    const target = activityTarget;
    if (!target) return;
    const activity = { ...form, id: uid("act"), userId: userKey(user), clientId: target.id, createdAt: new Date().toISOString() };
    let next = { ...data, activities: [activity, ...(data.activities || [])], clients: data.clients.map((c) => c.id === target.id ? { ...c, lastContactAt: activity.occurredAt || activity.createdAt, nextAction: form.nextAction || c.nextAction, nextActionAt: form.nextActionAt || c.nextActionAt } : c) };
    if (form.nextAction && form.nextActionAt) {
      const when = new Date(form.nextActionAt);
      next.calendarEvents = [{ id: uid("cal"), title: `${target.name} · ${form.nextAction}`, type: "Follow-up", date: dateKey(when), time: when.toTimeString().slice(0, 5), completed: false, ownerUserId: userKey(user), linkedEntityType: "client", linkedEntityId: target.id, createdAt: new Date().toISOString() }, ...(next.calendarEvents || [])];
    }
    next = withLog(next, log("Logged", "Sales Activity", `${form.type} · ${target.name}`, form.notes || form.outcome || ""));
    persist(next);
    setActivityTarget(null);
  };

  return (
    <div>
      <PageHeader
        eyebrow="Register"
        title="Clients & Counterparties"
        subtitle="Buyers, suppliers, agents and logistics partners"
        action={<Btn onClick={() => setModal("add")}><Plus size={14} /> Add Client</Btn>}
      />

      <div className="flex flex-col sm:flex-row gap-2 mb-5">
        <div className="relative flex-1">
          <Search size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500" />
          <TextInput className="pl-10 py-2.5" placeholder="Search by name or country…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        {isManagement(user) && (
          <div className="flex bg-[#1C1F21] border border-[#2B2F32] rounded-lg p-1">
            <button onClick={() => setScope("mine")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "mine" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>Mine</button>
            <button onClick={() => setScope("all")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "all" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>All</button>
          </div>
        )}
      </div>

      {filtered.length === 0 && <EmptyState label={scope === "mine" ? "Your book is empty. Add your first buyer or supplier." : "No clients yet."} />}

      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
        {filtered.map((c) => {
          const due = dueState(c.nextActionAt);
          const acts = (data.activities || []).filter((a) => a.clientId === c.id);
          const relatedDeals = (data.deals || []).filter((d) => d.clientId === c.id || d.buyerClientId === c.id || d.supplierClientId === c.id);
          const measuredDeals = relatedDeals.filter((d) => d.tradeOutcome && d.tradeOutcome !== "Open");
          const fulfilmentSamples = relatedDeals.map((d) => Number(d.fulfilmentPct)).filter((v) => Number.isFinite(v) && v > 0);
          const paymentSamples = relatedDeals.filter((d) => d.buyerClientId === c.id || (d.clientId === c.id && c.type === "Buyer")).map((d) => Number(d.actualPaymentDays)).filter((v) => Number.isFinite(v) && v >= 0);
          const avgFulfilment = fulfilmentSamples.length ? fulfilmentSamples.reduce((a,b) => a+b, 0) / fulfilmentSamples.length : "";
          const avgPaymentDays = paymentSamples.length ? paymentSamples.reduce((a,b) => a+b, 0) / paymentSamples.length : "";
          return (
            <Card key={c.id} className={`p-4 ${due === "overdue" ? "border-[#B9584A]/50" : ""}`}>
              {/* Original client card content — preserved */}
              <div className="flex items-start justify-between">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-stone-100 truncate">{c.name}</div>
                  <div className="text-xs text-stone-400 flex items-center gap-1 mt-0.5"><MapPin size={11} /> {c.area || "—"}</div>
                  {c.contactName && <div className="text-xs text-stone-500 mt-0.5">Contact: {c.contactName} {c.contactPhone ? `· ${c.contactPhone}` : ""}</div>}
                  {c.paymentTerms && <div className="text-xs text-stone-500 mt-0.5 flex items-center gap-1"><ClipboardList size={11} /> {c.paymentTerms}</div>}
                  {c.type === "Supplier" || c.type === "Both" ? (
                    <div className="text-xs text-stone-500 mt-1">
                      {(c.grades || []).length > 0 && <span>Grades: {c.grades.join(", ")}. </span>}
                      {c.monthlyQty && <span>~{c.monthlyQty}/mo</span>}{c.weeklyQty && <span>, ~{c.weeklyQty}/wk</span>}
                    </div>
                  ) : null}
                </div>
                <Pill tone="blue">{c.type}</Pill>
              </div>

              {/* Additive sales layer */}
              <div className="mt-3 pt-3 border-t border-[#2B2F32]">
                <div className="flex flex-wrap gap-2 text-[10px] text-stone-500">
                  <span>Owner: {userNameByKey(users, c.ownerUserId || c.originatorUserId || c.createdByUserId)}</span>
                  <span>·</span>
                  <span>{c.accountStatus || "Prospect"}</span>
                  {c.lastContactAt && <><span>·</span><span>Last activity {fmtTime(c.lastContactAt)}</span></>}
                </div>
                {c.nextAction && (
                  <div className={`mt-2 rounded-lg px-3 py-2 text-[11px] ${due === "overdue" ? "bg-[#B9584A]/10 border border-[#B9584A]/30 text-[#E89A8D]" : "bg-[#202426] text-stone-300"}`}>
                    <strong>Next:</strong> {c.nextAction}{c.nextActionAt ? ` · ${new Date(c.nextActionAt).toLocaleString()}` : ""}{due === "overdue" ? " · OVERDUE" : ""}
                  </div>
                )}
              </div>

              {relatedDeals.length > 0 && <div className="mt-3 rounded-lg bg-[#181B1D] border border-[#2B2F32] px-3 py-2">
                <div className="text-[9px] uppercase tracking-[0.12em] text-[#DB8A4E] mb-1">Relationship intelligence</div>
                <div className="flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-stone-500">
                  <span><strong className="text-stone-300">{relatedDeals.length}</strong> linked trade{relatedDeals.length === 1 ? "" : "s"}</span>
                  {measuredDeals.length > 0 && <span><strong className="text-stone-300">{measuredDeals.length}</strong> measured outcome{measuredDeals.length === 1 ? "" : "s"}</span>}
                  {avgFulfilment !== "" && <span>Avg fulfilment <strong className="text-stone-300">{avgFulfilment.toFixed(1)}%</strong></span>}
                  {avgPaymentDays !== "" && <span>Avg payment <strong className="text-stone-300">{avgPaymentDays.toFixed(1)}d</strong></span>}
                </div>
              </div>}

              {/* Original files/actions footer — preserved, with activity button added */}
              <div className="flex items-center justify-between mt-4 pt-3 border-t border-[#2B2F32]">
                <div className="flex gap-3 text-[10px] text-stone-500">
                  {(c.kyc || []).length > 0 && <span className="flex items-center gap-1"><ShieldCheck size={11} /> {c.kyc.length} KYC</span>}
                  {(c.docs || []).length > 0 && <span className="flex items-center gap-1"><Paperclip size={11} /> {c.docs.length} doc(s)</span>}
                  {(c.kyc || []).length === 0 && (c.docs || []).length === 0 && <span>No files</span>}
                  {acts.length > 0 && <span>{acts.length} activit{acts.length === 1 ? "y" : "ies"}</span>}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setActivityTarget(c)} title="Log sales activity" className="text-[#DB8A4E] hover:text-[#E7A874]"><Plus size={14} /></button>
                  <button onClick={() => setModal(c)} aria-label={`Edit ${c.name}`} title="Edit client" className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
                  {isManagement(user) && <button onClick={() => removeClient(c)} aria-label={`Delete ${c.name}`} title="Delete client" className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>}
                </div>
              </div>
            </Card>
          );
        })}
      </div>

      {modal && <ClientModal data={data} user={user} users={users} editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={saveClient} />}
      {activityTarget && <ActivityModal recordName={activityTarget.name} onClose={() => setActivityTarget(null)} onSave={saveActivity} />}
    </div>
  );
}

function ClientModal({ data, user, users, editing, onClose, onSave }) {
  // Original client fields — preserved exactly as the base model.
  const [name, setName] = useState(editing?.name || "");
  const [type, setType] = useState(editing?.type || CLIENT_TYPES[0]);
  const [area, setArea] = useState(editing?.area || "");
  const [grades, setGrades] = useState(editing?.grades || []);
  const [customGrade, setCustomGrade] = useState("");
  const [monthlyQty, setMonthlyQty] = useState(editing?.monthlyQty || "");
  const [weeklyQty, setWeeklyQty] = useState(editing?.weeklyQty || "");
  const [paymentTerms, setPaymentTerms] = useState(editing?.paymentTerms || "");
  const [deliveryTerms, setDeliveryTerms] = useState(editing?.deliveryTerms || DELIVERY_TERMS[0]);
  const editingWarehouseIsCustom = editing?.warehouse && !WAREHOUSES.includes(editing.warehouse);
  const [warehouse, setWarehouse] = useState(editingWarehouseIsCustom ? "Other" : (editing?.warehouse || WAREHOUSES[0]));
  const [warehouseOther, setWarehouseOther] = useState(editingWarehouseIsCustom ? editing.warehouse : "");
  const [contactMode, setContactMode] = useState("manual");
  const [contactName, setContactName] = useState(editing?.contactName || "");
  const [contactPhone, setContactPhone] = useState(editing?.contactPhone || "");
  const [contactEmail, setContactEmail] = useState(editing?.contactEmail || "");
  const [kyc, setKyc] = useState(editing?.kyc || []);
  const [docs, setDocs] = useState(editing?.docs || []);

  // Additive gap-fill fields.
  const [accountStatus, setAccountStatus] = useState(editing?.accountStatus || "Prospect");
  const [nextAction, setNextAction] = useState(editing?.nextAction || "");
  const [nextActionAt, setNextActionAt] = useState(editing?.nextActionAt || "");
  const [ownerUserId, setOwnerUserId] = useState(editing?.ownerUserId || userKey(user));

  const isSupplierLike = type === "Supplier" || type === "Both";

  const contactPool = data.clients
    .filter((c) => c.contactName)
    .map((c) => ({ name: c.contactName, phone: c.contactPhone, email: c.contactEmail, from: c.name }));

  const submit = () => {
    const resolvedOwner = isManagement(user) ? ownerUserId : (editing?.ownerUserId || userKey(user));
    onSave({
      name, type, area,
      grades: isSupplierLike ? grades : [],
      monthlyQty: isSupplierLike ? monthlyQty : "",
      weeklyQty: isSupplierLike ? weeklyQty : "",
      paymentTerms,
      deliveryTerms,
      warehouse: warehouse === "Other" ? warehouseOther.trim() : warehouse,
      contactName, contactPhone, contactEmail,
      kyc, docs,
      accountStatus,
      nextAction,
      nextActionAt,
      ownerUserId: resolvedOwner,
      visibility: resolvedOwner === "highlands" ? "Management" : (editing?.visibility || "Private"),
    }, editing);
  };

  const addGrade = (g) => { if (g && !grades.includes(g)) setGrades((cur) => [...cur, g]); };
  const removeGrade = (g) => setGrades((cur) => cur.filter((x) => x !== g));
  const addCustomGrade = () => {
    const val = customGrade.trim();
    if (val && !grades.includes(val)) setGrades((cur) => [...cur, val]);
    setCustomGrade("");
  };

  return (
    <Modal title={editing ? "Edit Client" : "Add Client"} onClose={onClose} wide>
      {/* 1. Client identity & pertinent information */}
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">Client information</div>
        <Field label="Client / company name">
          <TextInput value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. ABC Minerals (Pty) Ltd" autoFocus />
        </Field>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Client type">
            <Select value={type} onChange={(e) => setType(e.target.value)}>
              {CLIENT_TYPES.map((t) => <option key={t}>{t}</option>)}
            </Select>
          </Field>
          <Field label="Area / location" hint="e.g. Mooinooi, Steelpoort">
            <TextInput value={area} onChange={(e) => setArea(e.target.value)} placeholder="City, region or country" />
          </Field>
        </div>

        <div className="flex items-center justify-between mt-1 mb-1">
          <span className="block text-xs uppercase tracking-wide text-stone-400">Primary contact</span>
          {contactPool.length > 0 && (
            <div className="flex gap-1">
              <button onClick={() => setContactMode("manual")} className={`text-[11px] px-2 py-0.5 rounded-full ${contactMode === "manual" ? "bg-[#C9763C] text-[#141617]" : "bg-[#1C1F21] text-stone-400"}`}>New</button>
              <button onClick={() => setContactMode("pool")} className={`text-[11px] px-2 py-0.5 rounded-full ${contactMode === "pool" ? "bg-[#C9763C] text-[#141617]" : "bg-[#1C1F21] text-stone-400"}`}>From portfolio</button>
            </div>
          )}
        </div>
        {contactMode === "pool" && contactPool.length > 0 ? (
          <Select className="mb-1" onChange={(e) => {
            const c = contactPool[e.target.value];
            if (c) { setContactName(c.name); setContactPhone(c.phone || ""); setContactEmail(c.email || ""); }
          }}>
            <option value="">— pick a contact already on file —</option>
            {contactPool.map((c, i) => <option key={i} value={i}>{c.name} ({c.from})</option>)}
          </Select>
        ) : (
          <div className="grid sm:grid-cols-2 gap-2">
            <TextInput value={contactName} onChange={(e) => setContactName(e.target.value)} placeholder="Contact name" />
            <TextInput value={contactPhone} onChange={(e) => setContactPhone(e.target.value)} placeholder="Phone" />
            <TextInput className="col-span-2" value={contactEmail} onChange={(e) => setContactEmail(e.target.value)} placeholder="Email" />
          </div>
        )}
      </div>

      {/* 2. Supply details */}
      {isSupplierLike && (
        <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
          <div className="text-xs text-[#DB8A4E] mb-2">Supply details</div>
          <span className="block text-xs uppercase tracking-wide text-stone-400 mb-1">Grades they can supply</span>
          {grades.length > 0 && (
            <div className="flex flex-wrap gap-1 mb-2">
              {grades.map((g) => (
                <span key={g} className="flex items-center gap-1 text-[11px] pl-2 pr-1 py-1 rounded-full bg-[#C9763C] text-[#141617] font-medium">
                  {g}
                  <button type="button" onClick={() => removeGrade(g)} className="hover:opacity-60 rounded-full"><X size={11} /></button>
                </span>
              ))}
            </div>
          )}
          <div className="flex gap-2 mb-2">
            <Select value="" onChange={(e) => addGrade(e.target.value)} className="flex-1">
              <option value="">Add a standard grade…</option>
              {GRADE_SCALE.filter((g) => !grades.includes(g)).map((g) => <option key={g} value={g}>{g}</option>)}
            </Select>
          </div>
          <div className="flex gap-2 mb-2">
            <TextInput value={customGrade} onChange={(e) => setCustomGrade(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addCustomGrade(); } }} placeholder="Or type a custom grade, e.g. 44-46% (Premium)" className="flex-1" />
            <Btn variant="subtle" onClick={addCustomGrade} disabled={!customGrade.trim()}>Add</Btn>
          </div>
          <div className="grid sm:grid-cols-2 gap-2">
            <Field label="Monthly quantity"><TextInput value={monthlyQty} onChange={(e) => setMonthlyQty(e.target.value)} placeholder="e.g. 2000 MT" /></Field>
            <Field label="Weekly quantity"><TextInput value={weeklyQty} onChange={(e) => setWeeklyQty(e.target.value)} placeholder="e.g. 500 MT" /></Field>
          </div>
        </div>
      )}

      {/* 3. Delivery / fulfilment */}
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">Delivery & fulfilment</div>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Delivery terms">
            <Select value={deliveryTerms} onChange={(e) => setDeliveryTerms(e.target.value)}>
              {DELIVERY_TERMS.map((t) => <option key={t}>{t}</option>)}
            </Select>
          </Field>
          <Field label="Warehouse">
            <Select value={warehouse} onChange={(e) => setWarehouse(e.target.value)}>
              {WAREHOUSES.map((w) => <option key={w}>{w}</option>)}
            </Select>
          </Field>
        </div>
        {warehouse === "Other" && (
          <Field label="Warehouse name" hint="Enter the warehouse or port used">
            <TextInput value={warehouseOther} onChange={(e) => setWarehouseOther(e.target.value)} placeholder="e.g. Transnet Durban Container Terminal" />
          </Field>
        )}
      </div>

      {/* 4. Payment terms */}
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">Payment terms</div>
        <Field label="Payment terms" hint="e.g. 50% deposit, balance on POD; or Net 30 from invoice date">
          <TextInput value={paymentTerms} onChange={(e) => setPaymentTerms(e.target.value)} placeholder="e.g. Net 30 · Wire transfer" />
        </Field>
      </div>

      {/* 5. Additive sales ownership & follow-up */}
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">Sales ownership & follow-up</div>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Account status">
            <Select value={accountStatus} onChange={(e) => setAccountStatus(e.target.value)}>{ACCOUNT_STATUSES.map((x) => <option key={x}>{x}</option>)}</Select>
          </Field>
          {isManagement(user) ? (
            <Field label="Relationship owner / assign to">
              <Select value={ownerUserId} onChange={(e) => setOwnerUserId(e.target.value)}>
                <option value="highlands">Highlands Pool (Management only)</option>

        </div>
        <Field label="Next action"><TextInput value={nextAction} onChange={(e) => setNextAction(e.target.value)} placeholder="e.g. Follow up on pricing" /></Field>
        <Field label="Due"><TextInput type="datetime-local" value={nextActionAt} onInput={(e) => setNextActionAt(e.target.value)} onChange={(e) => setNextActionAt(e.target.value)} /></Field>
      </div>

      {/* 6. KYC & supporting documents */}
      <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">KYC & supporting documents</div>

          onRemove={(i) => setKyc((d) => d.filter((_, idx) => idx !== i))}
        />
        <UploadArea
          label="Supporting documents"
          files={docs}
          onAdd={(fs) => setDocs((d) => [...d, ...fs])}
          onRemove={(i) => setDocs((d) => d.filter((_, idx) => idx !== i))}
        />
      </div>

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn disabled={!name.trim()} onClick={submit}>{editing ? "Save changes" : "Add client"}</Btn>
      </div>
    </Modal>
  );
}

function MineralsTab({ data, persist, log, withLog }) {
  const [modal, setModal] = useState(null);

  const save = (form, editing) => {
    let next = { ...data };
    const label = `${form.commodity} · ${form.grade}`;
    const docLogs = logNewDocs(log, editing?.docs, form.docs, label, "Mineral documents");
    if (editing) {
      next.minerals = next.minerals.map((m) => (m.id === editing.id ? { ...m, ...form } : m));
      next = withLog(next, [log("Edited", "Mineral", label), ...docLogs]);
    } else {
      const m = { ...form, id: uid("min"), createdAt: new Date().toISOString() };
      next.minerals = [m, ...next.minerals];
      next = withLog(next, [log("Added", "Mineral", label), ...docLogs]);
    }
    persist(next);
    setModal(null);
  };

  const remove = (m) => {
    if (!confirmDelete(`mineral ${m.commodity} · ${m.grade}`)) return;
    let next = { ...data, minerals: data.minerals.filter((x) => x.id !== m.id) };
    next = withLog(next, log("Deleted", "Mineral", `${m.commodity} · ${m.grade}`));
    persist(next);
  };

  return (
    <div>
      <PageHeader
        eyebrow="Inventory"
        title="Supplier Pipeline"
        subtitle="Internal stock — feeds the mineral dropdown when adding a deal"
        action={<Btn onClick={() => setModal("add")}><Plus size={14} /> Add Mineral</Btn>}
      />
      {data.minerals.length === 0 && <EmptyState label="No inventory logged yet." />}
      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
        {data.minerals.map((m) => (
          <Card key={m.id} className="p-4 flex items-start justify-between">
            <div>
              <div className="text-sm font-medium text-stone-100">{m.commodity}</div>
              <div className="text-xs text-[#DB8A4E]">{m.grade}</div>
              <div className="text-xs text-stone-500 mt-0.5">{m.quantity} {m.unit} · <MapPin size={10} className="inline" /> {m.location}{m.owner ? ` (${m.owner})` : ""}</div>
              {m.washPlant && <div className="text-xs text-stone-600 mt-0.5">Source: {m.washPlant}</div>}
              {m.status && <div className="mt-1"><Pill tone={m.status === "Available" ? "green" : "amber"}>{m.status}</Pill></div>}
              {m.notes && <div className="text-xs text-stone-600 mt-1">{m.notes}</div>}
              {(m.docs || []).length > 0 && (
                <div className="text-[10px] text-stone-500 mt-1.5 flex items-center gap-1"><Paperclip size={10} /> {m.docs.length} document(s)</div>
              )}
            </div>
            <div className="flex gap-1">
              <button onClick={() => setModal(m)} className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
              <button onClick={() => remove(m)} className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>
            </div>
          </Card>
        ))}
      </div>
      {modal && <MineralModal editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

/* ---------------- CALENDAR ---------------- */

const CALENDAR_TYPES = ["Follow-up", "Meeting", "Dispatch", "Maintenance", "Payment", "Reminder"];

function CalendarTab({ data, persist, log, withLog, user }) {
  const today = new Date();
  const [cursor, setCursor] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [modal, setModal] = useState(null);

  const tripLabel = (trip) => {
    const truck = data.trucks.find((t) => t.id === trip.truckId);
    return trip.dispatchRef || truck?.reg || trip.truckManual || "Trip";
  };
  const visibleDealIds = new Set(data.deals.filter((d) => canViewRecord(user, d) || data.clients.some((c) => c.id === d.clientId && canViewRecord(user, c))).map((d) => d.id));
  const manualEvents = (data.calendarEvents || []).filter((e) => isManagement(user) || canViewRecord(user, e) || (e.dealId && visibleDealIds.has(e.dealId))).map((e) => ({ ...e, source: "manual" }));
  const tripEvents = data.trips.filter((trip) => isManagement(user) || (trip.dealId && visibleDealIds.has(trip.dealId))).flatMap((trip) => {
    const label = tripLabel(trip);
    return [
      trip.dispatchDate && { id: `${trip.id}_dispatch`, source: "trip", type: "Dispatch", title: `Dispatch ${label}`, date: dateKey(trip.dispatchDate), timeLabel: formatDateTime(trip.dispatchDate) },
      trip.scheduledPickup && { id: `${trip.id}_pickup`, source: "trip", type: "Dispatch", title: `Pickup ${label}`, date: dateKey(trip.scheduledPickup), timeLabel: formatDateTime(trip.scheduledPickup) },
      trip.eta && dateKey(trip.eta) && { id: `${trip.id}_eta`, source: "trip", type: "Dispatch", title: `ETA ${label}`, date: dateKey(trip.eta), timeLabel: formatDateTime(trip.eta) },
    ].filter(Boolean);
  });
  const allEvents = [...manualEvents, ...tripEvents];
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [...Array(firstWeekday).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];
  while (cells.length % 7) cells.push(null);
  const monthLabel = cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" });

  const save = (form, editing) => {
    let next = { ...data };
    if (editing?.id) {
      next.calendarEvents = (data.calendarEvents || []).map((e) => e.id === editing.id ? { ...e, ...form } : e);
      next = withLog(next, log("Edited", "Calendar", form.title));
    } else {
      next.calendarEvents = [{ ...form, id: uid("event"), ownerUserId: userKey(user), visibility: "Private", createdAt: new Date().toISOString() }, ...(data.calendarEvents || [])];
      next = withLog(next, log("Added", "Calendar", form.title));
    }
    persist(next);
    setModal(null);
  };

  const remove = (event) => {
    if (!confirmDelete(`calendar event ${event.title}`)) return;
    let next = { ...data, calendarEvents: (data.calendarEvents || []).filter((e) => e.id !== event.id) };
    next = withLog(next, log("Deleted", "Calendar", event.title));
    persist(next);
    setModal(null);
  };

  const upcoming = allEvents
    .filter((e) => e.date && e.date >= dateKey(today) && !e.completed)
    .sort((a, b) => `${a.date}${a.time || ""}`.localeCompare(`${b.date}${b.time || ""}`))
    .slice(0, 8);

  const eventTone = (type) => type === "Dispatch" ? "amber" : type === "Payment" ? "green" : type === "Maintenance" ? "red" : "blue";

  return (
    <div>
      <PageHeader
        eyebrow="Schedule"
        title="Calendar"
        subtitle="Dispatch dates, ETAs, follow-ups and business reminders in one view"
        action={<Btn onClick={() => setModal({ seedDate: dateKey(today) })}><Plus size={14} /> Add Event</Btn>}
      />

      <div className="grid lg:grid-cols-[1fr_260px] gap-4">
        <Card className="p-3 sm:p-4 overflow-hidden">
          <div className="flex items-center justify-between mb-4">
            <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="w-8 h-8 rounded-lg bg-[#202426] text-stone-400 hover:text-stone-100 flex items-center justify-center"><ChevronLeft size={15} /></button>
            <div className="text-center">
              <div className="font-display text-base text-stone-100">{monthLabel}</div>
              <button onClick={() => setCursor(new Date(today.getFullYear(), today.getMonth(), 1))} className="text-[10px] text-[#DB8A4E]">Today</button>
            </div>
            <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="w-8 h-8 rounded-lg bg-[#202426] text-stone-400 hover:text-stone-100 flex items-center justify-center"><ChevronRight size={15} /></button>
          </div>
          <div className="grid grid-cols-7 text-center mb-1">
            {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => <div key={d} className="text-[9px] sm:text-[10px] uppercase text-stone-600 py-1">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 border-l border-t border-[#2B2F32]">
            {cells.map((day, idx) => {
              const key = day ? dateKey(new Date(year, month, day)) : "";
              const events = day ? allEvents.filter((e) => e.date === key) : [];
              const isToday = key === dateKey(today);
              return (
                <button key={idx} disabled={!day} onClick={() => day && setModal({ seedDate: key })} className={`text-left min-h-[78px] sm:min-h-[104px] p-1.5 border-r border-b border-[#2B2F32] align-top ${day ? "hover:bg-[#202426]/60" : "bg-[#17191A]"}`}>
                  {day && <span className={`inline-flex w-6 h-6 items-center justify-center text-[11px] rounded-full ${isToday ? "bg-[#C9763C] text-[#141617] font-semibold" : "text-stone-400"}`}>{day}</span>}
                  <div className="space-y-1 mt-1">
                    {events.slice(0, 3).map((e) => (
                      <div key={e.id} onClick={(ev) => { if (e.source === "manual") { ev.stopPropagation(); setModal(e); } }} className={`truncate text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded border ${e.completed ? "line-through opacity-50" : ""} ${e.type === "Dispatch" ? "text-[#E7A874] border-[#C9763C]/30 bg-[#C9763C]/10" : "text-stone-300 border-[#383D40] bg-[#202426]"}`} title={e.title}>{e.title}</div>
                    ))}
                    {events.length > 3 && <div className="text-[9px] text-stone-600 pl-1">+{events.length - 3} more</div>}
                  </div>
                </button>
              );
            })}
          </div>
        </Card>

        <div>
          <Card className="p-4">
            <div className="text-xs text-[#DB8A4E] mb-3">Next up</div>
            {upcoming.length === 0 && <div className="text-xs text-stone-500">Nothing scheduled yet.</div>}
            <div className="space-y-3">
              {upcoming.map((e) => (
                <button key={e.id} onClick={() => e.source === "manual" && setModal(e)} className="block w-full text-left">
                  <div className="flex items-start justify-between gap-2"><div className="text-xs text-stone-200">{e.title}</div><Pill tone={eventTone(e.type)}>{e.type}</Pill></div>
                  <div className="text-[10px] text-stone-500 mt-0.5">{e.timeLabel || `${e.date}${e.time ? ` · ${e.time}` : ""}`}</div>
                </button>
              ))}
            </div>
          </Card>
          <div className="text-[10px] text-stone-600 mt-2 px-1">Dispatch dates and ETAs are added automatically from Logistics. Click a day to add a reminder.</div>
        </div>
      </div>

      {modal && <CalendarEventModal editing={modal.id ? modal : null} seedDate={modal.seedDate} deals={data.deals.filter((d) => isManagement(user) || visibleDealIds.has(d.id))} onClose={() => setModal(null)} onSave={save} onDelete={remove} />}
    </div>
  );
}

      <Field label="Notes"><TextArea rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
