/* ---------------- REPORTS & KPIs ---------------- */

function ReportsTab({ data }) {
  const [dept, setDept] = useState("Sales");
  const [printList, setPrintList] = useState(null); // 'inventory' | 'drivers' | 'weights' | null

  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7 * 86400000);
  const monthAgo = new Date(now.getTime() - 30 * 86400000);
  const inRange = (iso, from) => iso && new Date(iso) >= from;

  const dealsWon = data.deals.filter((d) => d.status === "Paid" || d.status === "Delivered").length;
  const dealsValue = data.deals.reduce((s, d) => s + ((Number(d.quantity) || 0) * (Number(d.price) || 0)), 0);
  const openPipeline = data.buyerPipeline.filter((p) => p.stage !== "Converted" && p.stage !== "Lost").length;
  const wonPipeline = data.buyerPipeline.filter((p) => p.stage === "Converted").length;

  const tripsThisWeek = data.trips.filter((t) => inRange(t.createdAt, weekAgo)).length;
  const tonnageThisMonth = data.trips
    .filter((t) => inRange(t.createdAt, monthAgo) && t.netWeight)
    .reduce((s, t) => s + (t.moisturePct ? Number(t.netWeight) * (1 - Number(t.moisturePct) / 100) : Number(t.netWeight)), 0);
  const podSigned = data.trips.filter((t) => (t.currentStepIndex || 0) >= TRIP_STEPS.length - 1).length;
  const activeTrucks = data.trucks.length;
  const lateTrips = data.trips.filter((t) => {
    const eta = t.eta ? new Date(t.eta) : null;
    return eta && !Number.isNaN(eta.getTime()) && eta < now && (t.currentStepIndex ?? 0) < TRIP_STEPS.length - 1;
  }).length;

  const invoicesIssued = data.invoices.length;
  const invoicedTotal = data.invoices.reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const genDocsCount = (data.genDocs || []).length;

  const clientCount = data.clients.length;
  const supplierCount = data.clients.filter((c) => c.type === "Supplier" || c.type === "Both").length;
  const buyerCount = data.clients.filter((c) => c.type === "Buyer" || c.type === "Both").length;

  // Highlands Trade Graph: outcome intelligence compiled from structured deal history.
  const measuredDeals = data.deals.filter((d) => d.tradeOutcome && d.tradeOutcome !== "Open");
  const fulfilmentSamples = data.deals.map((d) => Number(d.fulfilmentPct)).filter((v) => Number.isFinite(v) && v > 0);
  const avgFulfilment = fulfilmentSamples.length ? fulfilmentSamples.reduce((a,b) => a+b, 0) / fulfilmentSamples.length : 0;
  const deliverySamples = data.deals.map((d) => Number(d.deliveryVarianceDays)).filter((v) => Number.isFinite(v));
  const onTimeDeliveries = deliverySamples.filter((v) => v <= 0).length;
  const onTimePct = deliverySamples.length ? (onTimeDeliveries / deliverySamples.length) * 100 : 0;
  const paymentSamples = data.deals.map((d) => Number(d.actualPaymentDays)).filter((v) => Number.isFinite(v) && v >= 0);
  const avgPaymentDays = paymentSamples.length ? paymentSamples.reduce((a,b) => a+b, 0) / paymentSamples.length : 0;
  const repeatPositive = measuredDeals.filter((d) => ["Likely", "Confirmed"].includes(d.repeatTradeIntent)).length;
  const repeatPct = measuredDeals.length ? (repeatPositive / measuredDeals.length) * 100 : 0;

  const KPI = ({ label, value, sub }) => (
    <Card className="p-4">
      <div className="text-[10px] uppercase tracking-wide text-stone-500 mb-1">{label}</div>
      <div className="text-2xl font-semibold text-stone-100">{value}</div>
      {sub && <div className="text-[11px] text-stone-500 mt-0.5">{sub}</div>}
    </Card>
  );

  const inventoryRows = data.minerals.map((m) => ({
    Commodity: m.commodity, Grade: m.grade, Quantity: `${m.quantity}${m.unit}`, Location: m.location, "Wash Plant": m.washPlant || "—",
  }));
  const driverRows = data.trucks.map((t) => ({ "Truck Reg": t.reg, Trailers: trailersForTruck(t).map((x) => x.registration).join(", ") || "—", Driver: t.driver?.name || "—", Phone: t.driver?.phone || "—" }));
  const weightRows = data.trips
    .filter((t) => t.netWeight)
    .map((t) => {
      const truck = data.trucks.find((x) => x.id === t.truckId);
      const dry = t.moisturePct ? (Number(t.netWeight) * (1 - Number(t.moisturePct) / 100)).toFixed(2) : t.netWeight;
      const trailer = t.trailerManual || trailersForTruck(truck).find((x) => x.id === t.trailerId)?.registration || "—";
      return { "Truck Reg": truck?.reg || t.truckManual || "—", "Trailer Reg": trailer, "Dispatch Ref": t.dispatchRef || "—", "Net Wt (t)": t.netWeight, "Moisture %": t.moisturePct || "—", "Dry Wt (t)": dry, Date: t.createdAt ? t.createdAt.slice(0, 10) : "—" };
    });

  const listConfig = {
    inventory: { title: "Inventory List", rows: inventoryRows },
    drivers: { title: "Driver Phone List", rows: driverRows },
    weights: { title: "Weights Delivered", rows: weightRows },
  };

  return (
    <div>
      <PageHeader eyebrow="Visibility" title="Reports & KPIs" subtitle="Everyone logs into the same numbers — no more chasing updates on WhatsApp" />

      <div className="flex gap-1 mb-4 flex-wrap">
        {DEPARTMENTS.map((d) => (
          <button key={d} onClick={() => setDept(d)} className={`text-[11px] px-2.5 py-1 rounded-full ${dept === d ? "bg-[#C9763C] text-[#141617] font-medium" : "bg-[#202426] text-stone-400"}`}>{d}</button>
        ))}
      </div>

      {dept === "Sales" && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <KPI label="Deals won" value={dealsWon} sub={`of ${data.deals.length} total deals`} />
          <KPI label="Total deal value" value={dealsValue.toLocaleString(undefined, { maximumFractionDigits: 0 })} />
          <KPI label="Open pipeline" value={openPipeline} sub={`${wonPipeline} won`} />
          <KPI label="Clients on file" value={clientCount} sub={`${supplierCount} suppliers · ${buyerCount} buyers`} />
        </div>
      )}
      {dept === "Operations" && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <KPI label="Trips this week" value={tripsThisWeek} />
          <KPI label="Tonnage moved (30d)" value={tonnageThisMonth.toFixed(1)} sub="dry / moisture-adjusted" />
          <KPI label="POD signed" value={podSigned} sub={`of ${data.trips.length} trips`} />
          <KPI label="Late dispatches" value={lateTrips} sub={`${activeTrucks} trucks in fleet`} />
        </div>
      )}
      {dept === "Accounting" && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <KPI label="Invoices issued" value={invoicesIssued} />
          <KPI label="Total invoiced" value={invoicedTotal.toLocaleString(undefined, { maximumFractionDigits: 0 })} />
          <KPI label="Pro-formas / quotations" value={genDocsCount} />
          <KPI label="Deals awaiting invoice" value={Math.max(0, data.deals.length - invoicesIssued)} />
        </div>
      )}
      {dept === "Marketing" && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <KPI label="Buyer pipeline entries" value={data.buyerPipeline.length} />
          <KPI label="Open opportunities" value={openPipeline} />
          <KPI label="Won this period" value={wonPipeline} />
          <KPI label="Clients on file" value={clientCount} />
        </div>
      )}
      {dept === "HR" && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <KPI label="Drivers on file" value={data.trucks.filter((t) => t.driver?.name).length} />
          <KPI label="Fleet size" value={activeTrucks} />
          <KPI label="Team activity (audit entries)" value={data.auditLog.length} />
        </div>
      )}
      {dept === "Intelligence" && (
        <div>
          <div className="rounded-xl border border-[#C9763C]/30 bg-[#17191A] p-4 mb-4">
            <div className="text-xs uppercase tracking-[0.13em] text-[#DB8A4E]">Highlands Trade Graph</div>
            <div className="text-[11px] text-stone-500 mt-1">This view becomes more valuable as completed deals capture promised vs actual performance, payment behaviour and repeat-trade outcomes.</div>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <KPI label="Measured outcomes" value={measuredDeals.length} sub={`${data.deals.length - measuredDeals.length} deals still building history`} />
            <KPI label="Average fulfilment" value={fulfilmentSamples.length ? `${avgFulfilment.toFixed(1)}%` : "—"} sub={`${fulfilmentSamples.length} measured trade(s)`} />
            <KPI label="On-time delivery" value={deliverySamples.length ? `${onTimePct.toFixed(0)}%` : "—"} sub={`${deliverySamples.length} measured delivery(ies)`} />
            <KPI label="Average payment time" value={paymentSamples.length ? `${avgPaymentDays.toFixed(1)}d` : "—"} sub={`${paymentSamples.length} measured buyer payment(s)`} />
          </div>
          <div className="grid sm:grid-cols-2 gap-3 mb-6">
            <KPI label="Repeat-trade signal" value={measuredDeals.length ? `${repeatPct.toFixed(0)}%` : "—"} sub="Outcomes marked Likely or Confirmed" />
            <KPI label="Disputed outcomes" value={measuredDeals.filter((d) => d.tradeOutcome === "Disputed").length} sub="Structured disputes captured in trade history" />
          </div>
        </div>
      )}

      <Card className="p-4">
        <div className="text-xs text-[#DB8A4E] mb-3 flex items-center">
          Printable lists
          <InfoTip text="Generate a clean, printable list to hand to a stakeholder or keep for your records — uses your browser's print / save-as-PDF." />
        </div>
        <div className="flex flex-wrap gap-2">
          <Btn variant="subtle" onClick={() => setPrintList("inventory")}><Printer size={13} /> Inventory list</Btn>
          <Btn variant="subtle" onClick={() => setPrintList("drivers")}><Printer size={13} /> Driver phone list</Btn>
          <Btn variant="subtle" onClick={() => setPrintList("weights")}><Printer size={13} /> Weights delivered</Btn>
        </div>
      </Card>

      {printList && (
        <PrintableList title={listConfig[printList].title} rows={listConfig[printList].rows} onClose={() => setPrintList(null)} />
      )}
    </div>
  );
}

function PrintableList({ title, rows, onClose }) {
  const cols = rows.length > 0 ? Object.keys(rows[0]) : [];
  return (
    <div className="fixed inset-0 bg-black/70 flex items-start justify-center overflow-y-auto z-50 p-4">
      <div className="no-print flex gap-2 fixed top-4 right-4 z-10">
        <Btn onClick={() => window.print()}><Printer size={14} /> Print / Save as PDF</Btn>
        <Btn variant="ghost" onClick={onClose}><X size={14} /> Close</Btn>
      </div>
      <div id="print-root" className="bg-white text-[#1A1310] w-full max-w-3xl rounded-lg shadow-2xl p-8 my-10">
        <h2 className="text-lg font-semibold mb-1">{title}</h2>
        <div className="text-xs text-stone-500 mb-4">Generated {new Date().toLocaleString()}</div>
        {rows.length === 0 ? (
          <div className="text-sm text-stone-500">Nothing to show yet.</div>
        ) : (
          <table className="w-full text-xs border-collapse">
            <thead>
              <tr className="border-b border-stone-300 text-left uppercase text-[10px] text-stone-500">
                {cols.map((c) => <th key={c} className="py-2 pr-3">{c}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-b border-stone-100">
                  {cols.map((c) => <td key={c} className="py-1.5 pr-3">{r[c]}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ---------------- TUTORIAL / WORKFLOW GUIDE ---------------- */

const TUTORIAL_STEPS = [
  { title: "1. Log a supplier & their grades", body: "Add the wash plant / supplier under Clients, tagging the grades and typical monthly/weekly volumes they can supply. This becomes your searchable supply network." },
  { title: "2. List the stock in Supplier Pipeline", body: "Record what's actually available — commodity, grade, quantity, location and which Wash Plant it came from. This is what Sales draws on to structure a deal." },
  { title: "3. Structure the deal", body: "In Transactions, pick the client and mineral (pulled straight from their records), set quantity and price, and the deal is born. Its stage — Prospecting through Paid — shows as a visual flow on the card." },
  { title: "4. Build the fleet", body: "In Logistics → Fleet, add each truck, its driver pack and every trailer it can use. A truck can hold multiple trailers, and the correct trailer is assigned per trip." },
  { title: "5. Schedule and track dispatch", body: "In Logistics → Trips, enter the dispatch reference, truck and trailer, pickup, ETA, route and optional GPS link. Use Dispatch Board for location updates, late-load flags and one-click status progression." },
  { title: "6. Capture weighbridge slips", body: "On the trip, upload the weighbridge slip and assay report to capture gross/tare/net weight, grade and moisture. Always verify extracted figures before saving." },
  { title: "7. Work from the calendar", body: "Trip dispatch dates, pickups and ETAs appear on Calendar automatically. Add follow-ups, meetings, maintenance, payment dates and reminders alongside them." },
  { title: "8. Export, document and invoice", body: "Export the truck list from Trips, generate quotations or pro-formas under Documents, and invoice against the moisture-adjusted weight actually delivered." },
  { title: "9. Check the numbers anytime", body: "Reports & KPIs gives each department a live operational view, including late dispatches and printable inventory, driver and delivered-weight lists." },
];

function TutorialModal({ onClose }) {
  return (
    <Modal title="How to use this CRM" onClose={onClose} wide>
      <p className="text-xs text-stone-500 mb-4">
        One ledger, start to finish — from locking down a supplier to getting paid by the buyer. Here's the flow most deals follow:
      </p>
      <div className="space-y-3">
        {TUTORIAL_STEPS.map((s) => (
          <div key={s.title} className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3">
            <div className="text-sm text-[#DB8A4E] font-medium mb-1">{s.title}</div>
            <div className="text-xs text-stone-400 leading-relaxed">{s.body}</div>
          </div>
        ))}
      </div>
      <div className="flex justify-end mt-4">
        <Btn onClick={onClose}>Got it</Btn>
      </div>
    </Modal>
  );
}

/* ---------------- AUDIT LOG ---------------- */

function AuditTab({ data }) {
  const [q, setQ] = useState("");
  const filtered = data.auditLog.filter((l) => `${l.person} ${l.title} ${l.action} ${l.entity} ${l.label} ${l.details || ""}`.toLowerCase().includes(q.toLowerCase()));
  const actionTone = (a) => (a === "Added" ? "green" : a === "Deleted" ? "red" : "amber");

  return (
    <div>
      <PageHeader eyebrow="History" title="Audit Log" subtitle="Full activity trail for the whole team" />
      <div className="relative mb-5">
        <Search size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500" />
        <TextInput className="pl-10 py-2.5" placeholder="Search audit log…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      {filtered.length === 0 && <EmptyState label="Nothing logged yet." />}
      <div className="space-y-1.5">
        {filtered.map((l) => (
          <div key={l.id} className="flex items-start gap-2 bg-[#1C1F21] border border-[#2B2F32] rounded-lg px-3 py-2">
            <Pill tone={actionTone(l.action)}>{l.action}</Pill>
            <div className="flex-1 min-w-0">
              <div className="text-xs text-stone-200 truncate">
                <span className="text-stone-400">{l.entity}:</span> {l.label}
              </div>
              {l.details && <div className="text-[11px] text-stone-500 truncate">{l.details}</div>}
              <div className="text-[11px] text-stone-500">{l.person} · {l.title} · {fmtTime(l.at)}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
