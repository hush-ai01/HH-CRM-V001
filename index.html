// The original artifact host provides window.storage. A normal browser does not, so the
// standalone download falls back to localStorage and keeps the same no-install setup.
if (!window.storage) {
  const memoryStorage = {};
  const scopedKey = (key, shared) => `highlands:${shared ? "shared" : "personal"}:${key}`;
  window.storage = {
    async get(key, shared = false) {
      const k = scopedKey(key, shared);
      try {
        const value = window.localStorage.getItem(k);
        return value == null ? null : { value };
      } catch (e) {
        return memoryStorage[k] == null ? null : { value: memoryStorage[k] };
      }
    },
    async set(key, value, shared = false) {
      const k = scopedKey(key, shared);
      try { window.localStorage.setItem(k, value); } catch (e) { memoryStorage[k] = value; }
      return true;
    },
    async delete(key, shared = false) {
      const k = scopedKey(key, shared);
      try { window.localStorage.removeItem(k); } catch (e) { delete memoryStorage[k]; }
      return true;
    },
  };
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function dateKey(value) {
  if (!value) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function formatDateTime(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function trailersForTruck(truck) {
  if (!truck) return [];

  return truck.trailerNumber

    : [];
}

// Diffs an old vs new file list and returns one "Uploaded" audit entry per newly added
// file, so every document upload is tracked individually (who, what file, when, where).
function logNewDocs(log, oldArr, newArr, recordLabel, whereLabel) {
  const oldNames = new Set((oldArr || []).map((f) => f.name));
  const added = (newArr || []).filter((f) => !oldNames.has(f.name));
  return added.map((f) => log("Uploaded", "Document", f.name, `${whereLabel} — ${recordLabel || "Untitled"}`));
}

function fileToDataUrl(file, maxBytes = 1_500_000) {
  return new Promise((resolve, reject) => {
    if (file.size > maxBytes) {
      resolve({ name: file.name, size: file.size, dataUrl: null, tooLarge: true, type: file.type });
      return;
    }
    const r = new FileReader();
    r.onload = () => resolve({ name: file.name, size: file.size, dataUrl: r.result, tooLarge: false, type: file.type });
    r.onerror = () => reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
}

// Calls the Claude API (vision) to read a weighbridge slip or assay report image/PDF and
// pull out the structured numbers we need. Best-effort: on any failure it returns null and
// the caller falls back to manual entry — nothing here is required for the CRM to function.
async function aiExtractDocument(fileObj, kind) {
  if (!fileObj || !fileObj.dataUrl) return null;
  const isPdf = (fileObj.type || "").includes("pdf");
  const match = fileObj.dataUrl.match(/^data:([^;]+);base64,(.*)$/s);
  if (!match) return null;
  const mediaType = match[1];
  const base64Data = match[2];

  const instructions =
    kind === "weighbridge"
      ? "This is a weighbridge (weighbridge/weighbridge ticket) slip for a truck load of mined ore/concentrate. " +
        "Extract: truck registration, gross weight, tare weight, net weight (tonnes), and the date on the slip. " +
        "If net weight isn't printed directly, compute it as gross minus tare."
      : "This is a mineral assay / lab report for a shipment of ore or concentrate. " +
        "Extract: the assayed grade (%), and the moisture content (%). If several elements are assayed, use the primary commodity grade.";

  const schemaHint =
    kind === "weighbridge"
      ? '{"truckReg": string|null, "grossWeight": number|null, "tareWeight": number|null, "netWeight": number|null, "date": string|null}'
      : '{"grade": string|null, "moisturePct": number|null}';

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          {
            role: "user",
            content: [
              isPdf
                ? { type: "document", source: { type: "base64", media_type: mediaType, data: base64Data } }
                : { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
              {
                type: "text",
                text:
                  `${instructions} Respond with ONLY a single JSON object matching this shape (no markdown, no prose): ${schemaHint}. ` +
                  `Use null for anything you can't read confidently.`,
              },
            ],
          },
        ],
      }),
    });
    const json = await res.json();
    const text = (json.content || []).map((b) => b.text || "").join("").trim();
    const cleaned = text.replace(/```json|```/g, "").trim();
    return JSON.parse(cleaned);
  } catch (e) {
    return null;
  }
}

    if (!list.length) return;
    setBusy(true);
    const results = await Promise.all(list.map((f) => fileToDataUrl(f)));
    onAdd(results);
    setBusy(false);
    if (ref.current) ref.current.value = "";

  return (
    <div className="mb-3">
      <span className="block text-xs uppercase tracking-wide text-stone-400 mb-1">{label}</span>

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  };

  const start = (e) => {
    drawing.current = true;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.strokeStyle = "#1A1310";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const end = () => {
    if (!drawing.current) return;
    drawing.current = false;
    onChange(canvasRef.current.toDataURL("image/png"));
  };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    onChange(null);
  };

  useEffect(() => {
    // Restore a saved signature onto the canvas when re-opening the settings form.
    if (!value || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = value;
  }, []);

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={320}
        height={110}
        className="bg-white rounded-lg border border-[#2B2F32] touch-none w-full"
        onMouseDown={start}
        onMouseMove={move}
        onMouseUp={end}
        onMouseLeave={end}
        onTouchStart={start}
        onTouchMove={move}
        onTouchEnd={end}
      />
      <button type="button" onClick={clear} className="text-[11px] text-stone-500 hover:text-red-400 mt-1">
        Clear signature
      </button>
    </div>
  );
}

function CounterpartyPortal({ data, persist, log, withLog, user, onLogout }) {
  const client = data.clients.find((c) => c.id === user.linkedClientId);
  const [commodity, setCommodity] = useState(COMMODITIES[0]);
  const [grade, setGrade] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("MT");
  const [location, setLocation] = useState("");
  const [targetPrice, setTargetPrice] = useState("");
  const [currency, setCurrency] = useState("R");
  const [notes, setNotes] = useState("");
  const isSupplierPortal = user.role === "supplier_portal";
  const relatedDeals = (data.deals || []).filter((d) => d.clientId === user.linkedClientId || d.buyerClientId === user.linkedClientId || d.supplierClientId === user.linkedClientId);
  const relatedStock = (data.minerals || []).filter((m) => m.supplierClientId === user.linkedClientId || m.owner === client?.name || m.washPlant === client?.name);

  const submit = () => {
    if (!client || !quantity || !commodity) return alert("Add the commodity and quantity before submitting.");
    let next = { ...data };
    if (isSupplierPortal) {
      const stock = { id: uid("min"), commodity, grade: grade || "Not specified", quantity, unit, location, owner: client.name, washPlant: client.name, supplierClientId: client.id, status: "Available", notes, portalSubmitted: true, createdAt: new Date().toISOString() };
      next.minerals = [stock, ...next.minerals];
      next.portalSubmissions = [{ id: uid("ps"), type: "Supply Submission", clientId: client.id, mineralId: stock.id, submittedBy: user.email, at: new Date().toISOString() }, ...(next.portalSubmissions || [])];
      next = withLog(next, log("Submitted", "Supplier Portal", client.name, `${quantity} ${unit} ${commodity} added to Supplier Pipeline`));
    } else {
      const deal = { id: uid("deal"), dealRef: `PO-${Date.now().toString().slice(-6)}`, clientId: client.id, buyerClientId: client.id, mineralManual: `${commodity}${grade ? ` · ${grade}` : ""}`, quantity, unit, sellingPrice: targetPrice, price: targetPrice, currency, manualLocation: location, status: "Prospecting", paymentFirstPct: 70, paymentBalancePct: 30, notes, portalRequest: true, createdByUserId: user.email, originatorUserId: user.email, ownerUserId: "highlands", visibility: "Management", createdAt: new Date().toISOString() };
      next.deals = [deal, ...next.deals];
      next.portalSubmissions = [{ id: uid("ps"), type: "Buyer PO Request", clientId: client.id, dealId: deal.id, submittedBy: user.email, at: new Date().toISOString() }, ...(next.portalSubmissions || [])];
      next = withLog(next, log("Submitted", "Buyer Portal", client.name, `${quantity} ${unit} ${commodity} PO request`));
    }
    persist(next);
    setGrade(""); setQuantity(""); setLocation(""); setTargetPrice(""); setNotes("");
  };

  return <div className="min-h-screen bg-[#141617] text-stone-100 p-4 sm:p-6">
    <div className="max-w-5xl mx-auto">
      <div className="flex items-center justify-between mb-6"><div><div className="text-[10px] uppercase tracking-[0.16em] text-[#DB8A4E]">Highlands Counterparty Portal</div><h1 className="font-display text-2xl mt-1">{client?.name || user.name}</h1><div className="text-xs text-stone-500 mt-1">{isSupplierPortal ? "Submit new supply and track linked transactions" : "Submit new PO requests and track your transactions"}</div></div><Btn variant="ghost" onClick={onLogout}>Sign out</Btn></div>
      <div className="grid lg:grid-cols-[0.9fr_1.1fr] gap-4">
        <Card className="p-4"><div className="text-xs text-[#DB8A4E] mb-3">{isSupplierPortal ? "New supply submission" : "New PO request"}</div>
          <Field label="Commodity"><Select value={commodity} onChange={(e)=>setCommodity(e.target.value)}>{COMMODITIES.map((c)=><option key={c}>{c}</option>)}</Select></Field>
          <div className="grid sm:grid-cols-2 gap-2"><Field label="Grade / specification"><TextInput value={grade} onChange={(e)=>setGrade(e.target.value)} placeholder="e.g. 40–42%" /></Field><Field label="Quantity"><TextInput value={quantity} onChange={(e)=>setQuantity(e.target.value)} placeholder="2000" /></Field></div>
          <div className="grid sm:grid-cols-2 gap-2"><Field label="Unit"><TextInput value={unit} onChange={(e)=>setUnit(e.target.value)} /></Field><Field label={isSupplierPortal ? "Stock location" : "Delivery location"}><TextInput value={location} onChange={(e)=>setLocation(e.target.value)} placeholder="e.g. Steelpoort" /></Field></div>
          {!isSupplierPortal && <Field label="Target / PO price per unit"><div className="flex gap-1"><TextInput className="w-16" value={currency} onChange={(e)=>setCurrency(e.target.value)} /><TextInput value={targetPrice} onChange={(e)=>setTargetPrice(e.target.value)} /></div></Field>}
          <Field label="Notes"><TextArea rows={3} value={notes} onChange={(e)=>setNotes(e.target.value)} /></Field><div className="flex justify-end"><Btn onClick={submit}>{isSupplierPortal ? "Submit supply" : "Submit PO request"}</Btn></div>
        </Card>
        <div className="space-y-4"><Card className="p-4"><div className="text-xs text-[#DB8A4E] mb-3">Transaction overview</div>{relatedDeals.length===0?<div className="text-xs text-stone-500">No linked transactions yet.</div>:<div className="space-y-3">{relatedDeals.map((d)=><div key={d.id} className="bg-[#202426] rounded-lg p-3"><div className="flex justify-between gap-2"><div><div className="text-xs text-stone-200">{d.dealRef || d.mineralManual || "Transaction"}</div><div className="text-[10px] text-stone-500">{d.quantity} {d.unit} · {d.mineralManual || ""}</div></div><Pill tone={["Delivered","Testing","Payment 1","Paid"].includes(d.status)?"green":"amber"}>{dealStageLabel(d.status,d)}</Pill></div>{DEAL_FLOW_STAGES.includes(d.status)&&<div className="mt-3"><Stepper stages={DEAL_FLOW_STAGES.map((x)=>dealStageLabel(x,d))} currentIndex={DEAL_FLOW_STAGES.indexOf(d.status)} /></div>}</div>)}</div>}</Card>
        {isSupplierPortal && <Card className="p-4"><div className="text-xs text-[#DB8A4E] mb-3">Your submitted supply</div>{relatedStock.length===0?<div className="text-xs text-stone-500">No stock submissions yet.</div>:<div className="space-y-2">{relatedStock.map((m)=><div key={m.id} className="bg-[#202426] rounded-lg p-3 text-xs"><div className="text-stone-200">{m.commodity} · {m.grade}</div><div className="text-stone-500">{m.quantity} {m.unit} · {m.location || "Location not set"}</div></div>)}</div>}</Card>}
        </div>
      </div>
    </div>
  </div>;
}

/* ---------------- App ---------------- */

function App() {
  const [user, setUser] = useState(null);
  const [loadingUser, setLoadingUser] = useState(false);
  const [data, setData] = useState(emptyData());
  const [loadingData, setLoadingData] = useState(true);
  const [saveErr, setSaveErr] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [settings, setSettings] = useState({
    testMode: true,
    company: { name: "Highlands Holdings", address: "", phone: "", email: "", bank: "" },
    signatories: [],
  });
  const [tutorialOpen, setTutorialOpen] = useState(false);
  const [loadingSettings, setLoadingSettings] = useState(true);
  const [users, setUsers] = useState({});
  const [loadingUsers, setLoadingUsers] = useState(true);
  const [greeting, setGreeting] = useState(null); // e.g. "Welcome back, Taryl" — shown briefly, then fades

  useEffect(() => {
    if (!greeting) return;
    const t = setTimeout(() => setGreeting(null), 4000);
    return () => clearTimeout(t);
  }, [greeting]);

  const firstName = (name) => (name || "").trim().split(/\s+/)[0] || "there";

  // load shared settings (test mode toggle) — shared so it's the same for everyone
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SETTINGS_KEY, true);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setSettings((prev) => ({
            ...prev,
            ...parsed,
            company: { ...prev.company, ...(parsed.company || {}) },
            signatories: parsed.signatories || [],
          }));
        }
      } catch (e) {
        /* defaults to test mode on first run */
      }
      setLoadingSettings(false);
    })();
  }, []);

  const saveSettings = async (next) => {
    setSettings(next);
    try {
      await window.storage.set(SETTINGS_KEY, JSON.stringify(next), true);
    } catch (e) {
      /* best effort */
    }
  };

  // load current user (personal, not shared) — a returning person is recognized
  // automatically from their saved session, no need to sign in again.
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(USER_KEY, false);
        if (res && res.value) {
          const u = JSON.parse(res.value);
          setUser(u);
          setGreeting(`Welcome back, ${firstName(u.name)}`);
        }
      } catch (e) {
        /* no user yet */
      }
      setLoadingUser(false);
    })();
  }, []);

  // load shared registry of everyone who has ever registered — keyed by email,
  // so a returning person only needs to type their email to sign back in.
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(USERS_KEY, true);
        if (res && res.value) setUsers(JSON.parse(res.value));
      } catch (e) {
        /* nobody registered yet */
      }
      setLoadingUsers(false);
    })();
  }, []);

  // load shared CRM data
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setData({ ...emptyData(), ...parsed });
        }
      } catch (e) {
        /* nothing stored yet */
      }
      setLoadingData(false);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), true);
      setSaveErr(!res);
    } catch (e) {
      setSaveErr(true);
    }
  }, []);

  const log = useCallback(
    (action, entity, label, details) => {
      if (!user) return null;
      return {
        id: uid("log"),
        person: user.name,
        title: user.title,
        userEmail: userKey(user),
        userRole: user.role || "salesperson",
        action, // Added / Edited / Deleted
        entity, // Deal / Client / Mineral / Truck / Trip / Invoice / Document
        label,
        details: details || "",
        at: new Date().toISOString(),
      };
    },
    [user]
  );

  // Accepts a single log entry OR an array of them (e.g. an "Edited" entry plus one
  // "Uploaded" entry per new document) and prepends them all in one go.
  const withLog = (next, entry) => {
    const entries = (Array.isArray(entry) ? entry : [entry]).filter(Boolean);
    return entries.length ? { ...next, auditLog: [...entries, ...next.auditLog].slice(0, 500) } : next;
  };

  // One-time import of the priority buyer leads PDF into the Buyer Pipeline. Runs once
  // a logged-in user is present so the import itself lands in the audit trail; guarded by
  // BUYER_SEED_SOURCE so it only ever adds each lead once, even across multiple team members.
  useEffect(() => {
    if (loadingData || loadingUser || !user) return;
    const existingNames = new Set((data.buyerPipeline || []).map((b) => b.name));
    const toAdd = BUYER_PIPELINE_SEED.filter((b) => !existingNames.has(b.name));
    if (!toAdd.length) return;
    const seeded = toAdd.map((b) => ({ ...b, id: uid("buyer"), createdAt: new Date().toISOString(), createdByUserId: "highlands", originatorUserId: "highlands", ownerUserId: "highlands", visibility: "Management", relationshipSource: "Highlands Existing", priority: b.priority || "High" }));
    let next = { ...data, buyerPipeline: [...seeded, ...(data.buyerPipeline || [])] };
    next = withLog(next, log("Imported", "Buyer Lead", `${seeded.length} leads from Highland Holdings Global Buyer Pipeline PDF`));
    persist(next);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loadingData, loadingUser, user]);

  const saveUser = async (u) => {
    setUser(u);
    try {
      await window.storage.set(USER_KEY, JSON.stringify(u), false);
    } catch (e) {
      /* best effort */
    }
  };

  const saveUsersRegistry = async (nextUsers) => {
    setUsers(nextUsers);
    try { await window.storage.set(USERS_KEY, JSON.stringify(nextUsers), true); } catch (e) { /* best effort */ }
    const current = nextUsers[user?.email];
    if (current && current.email === user?.email) await saveUser(current);
  };

  // First registered test user becomes Management; subsequent users default to Salesperson.
  // This is intentionally simple for the controlled CRM test and avoids self-selected privilege escalation.
  const registerUser = async (u) => {
    const hasManagement = Object.values(users || {}).some((x) => x.role === "management");
    const namedManagement = isNamedManagement(u.name);
    const enriched = { ...u, role: namedManagement || !hasManagement ? "management" : "salesperson", team: namedManagement || !hasManagement ? "Management" : "Sales", active: true };
    const nextUsers = { ...users, [enriched.email]: enriched };
    setUsers(nextUsers);
    try {
      await window.storage.set(USERS_KEY, JSON.stringify(nextUsers), true);
    } catch (e) {
      /* best effort */
    }
    await saveUser(enriched);
    setGreeting(`Welcome, ${firstName(enriched.name)} · ${roleLabel(enriched)}`);
  };

  // Legacy users are assigned a role on first login: the first unassigned user becomes Management,
  // then everyone else defaults to Salesperson. Existing named roles are preserved.
  const loginUser = async (u) => {
    let enriched = u;
    if (!u.role) {
      const hasManagement = Object.values(users || {}).some((x) => x.role === "management");
      const namedManagement = isNamedManagement(u.name);
      enriched = { ...u, role: namedManagement || !hasManagement ? "management" : "salesperson", team: namedManagement || !hasManagement ? "Management" : "Sales", active: true };
      const nextUsers = { ...users, [enriched.email]: enriched };
      setUsers(nextUsers);
      try { await window.storage.set(USERS_KEY, JSON.stringify(nextUsers), true); } catch (e) { /* best effort */ }
    }
    await saveUser(enriched);
    setGreeting(`Welcome back, ${firstName(enriched.name)}`);
  };

  const logout = async () => {
    setUser(null);
    try {
      await window.storage.delete(USER_KEY, false);
    } catch (e) {
      /* best effort */
    }
  };

  const toggleTestMode = () => {
    const next = { ...settings, testMode: !settings.testMode };
    saveSettings(next);
    if (user) {
      const entry = log(next.testMode ? "Enabled" : "Disabled", "Settings", "Test mode (Gmail sign-in)");
      persist(withLog(data, entry));
    }
  };

  if (loadingUser || loadingData || loadingSettings || loadingUsers) {
    return (
      <div className="min-h-screen bg-[#141617] flex items-center justify-center text-stone-400 text-sm">
        <Loader2 className="animate-spin mr-2" size={16} /> Loading CRM…
      </div>
    );
  }

  if (!user) {
    return <LoginGate users={users} onRegister={registerUser} onLogin={loginUser} testMode={settings.testMode} />;
  }

  if (["buyer_portal", "supplier_portal"].includes(user.role)) {
    return <CounterpartyPortal data={data} persist={persist} log={log} withLog={withLog} user={user} onLogout={logout} />;
  }

  // Read-only permission-safe dataset used by dashboards/reports. Mutable modules keep the
  // full dataset and enforce ownership internally so hidden records are never overwritten.
  const visibleClients = data.clients.filter((x) => canViewRecord(user, x));
  const visibleClientIds = new Set(visibleClients.map((x) => x.id));
  const visibleBuyerPipeline = data.buyerPipeline.filter((x) => canViewRecord(user, x));
  const visibleLeadIds = new Set(visibleBuyerPipeline.map((x) => x.id));
  const visibleDeals = data.deals.filter((x) => canViewRecord(user, x) || (x.clientId && visibleClientIds.has(x.clientId)));
  const visibleDealIds = new Set(visibleDeals.map((x) => x.id));
  const visibleCalendarEvents = (data.calendarEvents || []).filter((x) => isManagement(user) || canViewRecord(user, x) || (x.dealId && visibleDealIds.has(x.dealId)));
  const visibleTrips = data.trips.filter((x) => isManagement(user) || (x.dealId && visibleDealIds.has(x.dealId)));
  const visibleInvoices = data.invoices.filter((x) => isManagement(user) || (x.dealId && visibleDealIds.has(x.dealId)));
  const visibleActivities = (data.activities || []).filter((x) => isManagement(user) || x.userId === userKey(user) || (x.clientId && visibleClientIds.has(x.clientId)) || (x.buyerLeadId && visibleLeadIds.has(x.buyerLeadId)) || (x.dealId && visibleDealIds.has(x.dealId)));
  const visibleAudit = isManagement(user) ? data.auditLog : data.auditLog.filter((x) => String(x.userEmail || "").toLowerCase() === userKey(user));
  const visibleData = { ...data, clients: visibleClients, buyerPipeline: visibleBuyerPipeline, deals: visibleDeals, trips: visibleTrips, invoices: visibleInvoices, calendarEvents: visibleCalendarEvents, activities: visibleActivities, auditLog: visibleAudit };

  const todayKey = dateKey(new Date());
  const activeDispatches = visibleData.trips.filter((trip) => (trip.currentStepIndex ?? 0) < TRIP_STEPS.length - 1);
  const lateDispatches = activeDispatches.filter((trip) => trip.eta && new Date(trip.eta).getTime() < Date.now());
  const maintenanceItems = isManagement(user) ? data.trucks.reduce((count, truck) => count + (/maintenance/i.test(truck.status || "") ? 1 : 0) + trailersForTruck(truck).filter((trailer) => /maintenance/i.test(trailer.status || "")).length, 0) : 0;
  const overdueEvents = (visibleData.calendarEvents || []).filter((event) => !event.completed && event.date && event.date < todayKey).length;
  const sevenDaysOut = dateKey(new Date(Date.now() + 7 * 86400000));
  const upcomingEvents = (visibleData.calendarEvents || []).filter((event) => !event.completed && event.date >= todayKey && event.date <= sevenDaysOut).length;
  const attentionCount = lateDispatches.length + maintenanceItems + overdueEvents;

  const ALL_TABS = [
    { id: "dashboard", label: "Dashboard", icon: BarChart2, badge: attentionCount, badgeTone: "alert", roles: ["management", "salesperson", "operations", "finance"] },
    { id: "clients", label: "Clients", icon: Users, roles: ["management", "salesperson"] },
    { id: "minerals", label: "Supplier Pipeline", icon: Boxes, roles: ["management", "operations"] },
    { id: "deals", label: "Transactions", icon: ClipboardList, roles: ["management", "salesperson", "operations", "finance"] },
    { id: "logistics", label: "Logistics", icon: Truck, badge: activeDispatches.length, roles: ["management", "operations"] },
    { id: "calendar", label: "Calendar", icon: CalendarDays, badge: upcomingEvents, roles: ["management", "salesperson", "operations", "finance"] },
    { id: "pipeline", label: "Buyer Pipeline", icon: Target, roles: ["management", "salesperson"] },
    { id: "documents", label: "Documents", icon: FileText, roles: ["management", "finance"] },
    { id: "reports", label: "Reports & KPIs", icon: BarChart2, roles: ["management", "salesperson", "operations", "finance"] },
    { id: "audit", label: "Audit Log", icon: History, roles: ["management"] },
    { id: "settings", label: "Settings", icon: Settings2, roles: ["management"] },
  ];
  const TABS = ALL_TABS.filter((t) => t.roles.includes(user.role || "salesperson"));

  return (
    <div className="min-h-screen bg-[#141617] text-stone-100 md:flex">
      {greeting && (
        <div className="fixed top-4 right-4 z-[60] bg-[#1C1F21] border border-[#C9763C]/50 rounded-lg px-4 py-2.5 shadow-[0_8px_24px_rgba(0,0,0,0.45)] flex items-center gap-2 animate-[fadeIn_0.2s_ease-out]">
          <Check size={14} className="text-[#DB8A4E]" />
          <span className="text-sm text-stone-100">{greeting}</span>
        </div>
      )}
      {/* ---------------- Sidebar ---------------- */}
      <aside className="md:w-64 md:h-screen md:sticky md:top-0 flex flex-col border-b md:border-b-0 md:border-r border-[#202426] bg-[#141617] z-30">
        <div className="flex items-center gap-3 px-5 py-5">
          <div className="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 bg-white flex items-center justify-center p-1 shadow-[0_4px_14px_rgba(0,0,0,0.4),0_0_0_1px_#383D40]">
            <img src={LOGO_DATA_URL} alt="Highlands Holdings" className="w-full h-full object-contain" />
          </div>
          <div className="min-w-0">
            <div className="font-display text-[14px] leading-tight text-stone-100 truncate">Highlands<br />Holdings</div>
            <div className="text-[10px] text-stone-500 tracking-[0.10em] mt-1">HH CRM v001</div>
          </div>
        </div>

        <nav className="flex md:flex-col overflow-x-auto md:overflow-x-visible gap-1 px-3 pb-3 md:pb-0 md:mt-2 no-scrollbar">
          {TABS.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button
                 key={t.id}
                 onClick={() => setTab(t.id)}
                 aria-current={active ? "page" : undefined}
                 className={`font-display flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg text-[11.5px] whitespace-nowrap tracking-[0.06em] transition-all ${
                  active
                    ? "bg-[#C9763C]/15 text-[#E7A874] border border-[#C9763C]/40 shadow-[0_2px_10px_rgba(201,118,60,0.12)]"
                    : "border border-transparent text-stone-400 hover:text-stone-200 hover:bg-[#1C1F21]"
                }`}
              >
                 <Icon size={15} />
                 {t.label}
                 {t.badge > 0 && (
                   <span className={`ml-auto min-w-5 h-5 px-1.5 rounded-full inline-flex items-center justify-center text-[9px] tracking-normal ${t.badgeTone === "alert" ? "bg-[#B9584A]/20 text-[#E89A8D]" : "bg-[#C9763C]/20 text-[#E7A874]"}`}>
                     {t.badge > 99 ? "99+" : t.badge}
                   </span>
                 )}
              </button>
            );
          })}
        </nav>

        <div className="hidden md:block mt-auto">
          {saveErr && (
            <div className="mx-4 mb-2 text-[11px] text-red-400 flex items-center gap-1">
              <AlertCircle size={12} /> Save failed — changes may not persist.
            </div>
          )}

  );
}

function domainOf(email) {
  const at = email.lastIndexOf("@");
  return at === -1 ? "" : email.slice(at + 1).trim().toLowerCase();
}

function LoginGate({ users, onRegister, onLogin, testMode }) {
  const [step, setStep] = useState("email"); // "email" | "register"
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [title, setTitle] = useState("");
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);

  const validateEmail = (e) => {
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    if (!emailValid) return "Enter a valid email address.";
    const domain = domainOf(e);
    const allowed = domain === COMPANY_DOMAIN || (testMode && domain === TEST_DOMAIN);
    if (!allowed) {
      return testMode
        ? `Only @${COMPANY_DOMAIN} or @${TEST_DOMAIN} addresses are allowed right now.`
        : `Only @${COMPANY_DOMAIN} company emails are allowed — Gmail sign-in is off (live mode).`;
    }
    return "";
  };

  // Step 1: email only. If this address has registered before, sign them straight in.
  // If not, this is their first time — move to the one-time registration step.
  const submitEmail = async () => {
    const e = email.trim().toLowerCase();
    const existing = users[e];
    const err = existing ? (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e) ? "" : "Enter a valid email address.") : validateEmail(e);
    if (err) {
      setError(err);
      return;
    }
    setError("");
    setChecking(true);
    setChecking(false);
    if (existing) {
      onLogin(existing);
    } else {
      setEmail(e);
      setStep("register");
    }
  };

  // Step 2 (first time only): capture name + title once, register, and log in.
  const submitRegister = () => {
    if (!name.trim() || !title.trim()) {
      setError("Enter your name and title to finish registering.");
      return;
    }
    setError("");
    onRegister({ name: name.trim(), title: title.trim(), email });
  };

  if (step === "register") {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{ background: "radial-gradient(1100px 600px at 15% -10%, #1E2224 0%, #141617 55%)" }}>
        <Card className="w-full max-w-sm p-6">
          <div className="w-12 h-12 rounded-xl overflow-hidden mx-auto mb-4 bg-white flex items-center justify-center p-1 shadow-[0_4px_14px_rgba(0,0,0,0.4),0_0_0_1px_#383D40]">
            <img src={LOGO_DATA_URL} alt="Highlands Holdings" className="w-full h-full object-contain" />
          </div>
          <div className="text-center mb-5">
            <div className="font-display text-stone-100 text-[15px]">Highlands Holdings</div>
            <div className="text-[11px] text-stone-500 mt-1">New here — quick one-time setup for {email}</div>
          </div>

          <Field label="Name">
            <TextInput value={name} onChange={(e) => setName(e.target.value)} placeholder="Taryl Ogle" autoFocus />
          </Field>
          <Field label="Title">
            <TextInput value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Founder" />
          </Field>

          {error && (
            <div className="text-[12px] text-red-400 flex items-center gap-1 mb-2">
              <AlertCircle size={12} /> {error}
            </div>
          )}

          <div className="flex gap-2 mt-1">
            <Btn variant="ghost" onClick={() => { setStep("email"); setError(""); }}>Back</Btn>
            <Btn className="flex-1 justify-center" disabled={!name.trim() || !title.trim()} onClick={submitRegister}>
              Enter CRM
            </Btn>
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ background: "radial-gradient(1100px 600px at 15% -10%, #1E2224 0%, #141617 55%)" }}>
      <Card className="w-full max-w-sm p-6">
        <div className="w-12 h-12 rounded-xl overflow-hidden mx-auto mb-4 bg-white flex items-center justify-center p-1 shadow-[0_4px_14px_rgba(0,0,0,0.4),0_0_0_1px_#383D40]">
          <img src={LOGO_DATA_URL} alt="Highlands Holdings" className="w-full h-full object-contain" />
        </div>
        <div className="text-center mb-5">
          <div className="font-display text-stone-100 text-[15px]">Highlands Holdings</div>
          <div className="text-[11px] text-stone-500 mt-1">Sign in to the trading CRM</div>
        </div>

        <Field label="Work email">
          <TextInput
            value={email}
            onChange={(e) => { setEmail(e.target.value); setError(""); }}
            onKeyDown={(e) => e.key === "Enter" && submitEmail()}
            placeholder={testMode ? "you@gmail.com or you@highlandsholdings.org" : "you@highlandsholdings.org"}
            autoFocus
          />
        </Field>

        {error && (
          <div className="text-[12px] text-red-400 flex items-center gap-1 mb-2">
            <AlertCircle size={12} /> {error}
          </div>
        )}

        <Btn className="w-full justify-center mt-1" disabled={!email.trim() || checking} onClick={submitEmail}>
          {checking ? <><Loader2 className="animate-spin" size={14} /> Checking…</> : "Continue"}
        </Btn>
      </Card>
    </div>
  );
}

function DashboardTab({ data, setTab, user }) {
  const now = new Date();
  const today = dateKey(now);
  const compact = (value) => new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(Number(value) || 0);
  const currencies = new Set(data.deals.map((d) => d.currency).filter(Boolean));
  const currency = currencies.size === 1 ? Array.from(currencies)[0] : "";
  const dealValue = data.deals.reduce((sum, d) => sum + (Number(d.quantity) || 0) * (Number(d.price) || 0), 0);
  const activeDeals = data.deals.filter((d) => !["Delivered", "Paid"].includes(d.status));
  const activeTrips = data.trips.filter((t) => (t.currentStepIndex ?? 0) < TRIP_STEPS.length - 1);
  const lateTrips = activeTrips.filter((t) => {
    const eta = t.eta ? new Date(t.eta) : null;
    return eta && !Number.isNaN(eta.getTime()) && eta < now;
  });
  const fleetReady = data.trucks.filter((t) => t.status === "Available").length;
  const fleetReadyPct = data.trucks.length ? Math.round((fleetReady / data.trucks.length) * 100) : 0;
  const trailerCount = data.trucks.reduce((sum, t) => sum + trailersForTruck(t).length, 0);
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 86400000);
  const tonnage30d = data.trips
    .filter((t) => t.createdAt && new Date(t.createdAt) >= thirtyDaysAgo && t.netWeight)
    .reduce((sum, t) => sum + Number(t.netWeight) * (t.moisturePct ? 1 - Number(t.moisturePct) / 100 : 1), 0);
  const openPipeline = data.buyerPipeline.filter((b) => !["Converted", "Lost"].includes(b.stage)).length;
  const overdueReminders = (data.calendarEvents || []).filter((e) => e.date < today && !e.completed).length;
  const maintenanceCount = data.trucks.filter((t) => t.status === "Maintenance").length;

  const truckLabel = (trip) => data.trucks.find((t) => t.id === trip.truckId)?.reg || trip.truckManual || "Unassigned";
  const scheduleEvents = [
    ...(data.calendarEvents || []).filter((e) => !e.completed).map((e) => ({ id: e.id, title: e.title, type: e.type || "Reminder", at: new Date(`${e.date}T${e.time || "23:59"}`) })),
    ...data.trips.flatMap((t) => [
      t.scheduledPickup && { id: `${t.id}_pickup`, title: `Pickup · ${t.dispatchRef || truckLabel(t)}`, type: "Dispatch", at: new Date(t.scheduledPickup) },
      t.eta && { id: `${t.id}_eta`, title: `ETA · ${t.dispatchRef || truckLabel(t)}`, type: "ETA", at: new Date(t.eta) },
    ].filter(Boolean)),
  ].filter((e) => !Number.isNaN(e.at.getTime()) && e.at >= now).sort((a, b) => a.at - b.at).slice(0, 6);

  const stageRows = DEAL_FLOW_STAGES.map((stage) => ({ stage, count: data.deals.filter((d) => d.status === stage).length }));
  const maxStage = Math.max(1, ...stageRows.map((s) => s.count));
  const alerts = lateTrips.length + maintenanceCount + overdueReminders;
  const weightedPipeline = (data.buyerPipeline || []).reduce((sum, b) => sum + (Number(b.estimatedValue) || 0) * ((Number(b.probability) || 0) / 100), 0);
  const pipelineCurrencies = new Set((data.buyerPipeline || []).map((b) => b.estimatedCurrency).filter(Boolean));
  const pipelineCurrency = pipelineCurrencies.size === 1 ? Array.from(pipelineCurrencies)[0] : "";
  const salesOverdue = (data.buyerPipeline || []).filter((b) => dueState(b.nextActionAt) === "overdue" && !["Converted", "Lost"].includes(b.stage)).length;
  const salesDueToday = (data.buyerPipeline || []).filter((b) => dueState(b.nextActionAt) === "today" && !["Converted", "Lost"].includes(b.stage)).length;
  const expectedCommission = (data.deals || []).reduce((sum, d) => sum + (Number(d.expectedCommission) || 0), 0);

  const StatCard = ({ label, value, sub, icon: Icon, tone = "copper" }) => {
    const tones = {
      copper: "from-[#C9763C]/20 to-[#1C1F21] border-[#C9763C]/35 text-[#E7A874]",
      red: "from-[#B9584A]/20 to-[#1C1F21] border-[#B9584A]/35 text-[#D98274]",
      green: "from-[#7C9885]/20 to-[#1C1F21] border-[#7C9885]/35 text-[#A7C1AE]",
      blue: "from-[#6B93AE]/20 to-[#1C1F21] border-[#6B93AE]/35 text-[#9ABCD1]",
    };
    return (
      <div className={`relative overflow-hidden bg-gradient-to-br border rounded-xl p-4 ${tones[tone]}`}>
        <div className="absolute -right-5 -top-5 w-20 h-20 rounded-full bg-current opacity-[0.04]" />
        <div className="flex items-center justify-between"><div className="text-[10px] uppercase tracking-[0.12em] text-stone-500">{label}</div><Icon size={15} /></div>
        <div className="text-2xl font-semibold text-stone-100 mt-2">{value}</div>
        <div className="text-[10px] text-stone-500 mt-1 min-h-[15px]">{sub}</div>
      </div>
    );
  };

  return (
    <div>
      <div className="relative overflow-hidden rounded-2xl border border-[#C9763C]/35 p-5 sm:p-6 mb-5 shadow-[0_18px_60px_rgba(0,0,0,0.35)]" style={{ background: "radial-gradient(700px 260px at 90% 0%, rgba(201,118,60,0.25), transparent 60%), linear-gradient(135deg, #202426 0%, #17191A 65%)" }}>

        <div className="relative flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="flex items-center gap-2 mb-2"><Pill tone="green">Live command centre</Pill><span className="text-[10px] text-stone-600">This device · refreshed {now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></div>
            <h1 className="font-display text-2xl sm:text-3xl text-stone-100">Operations Dashboard</h1>

        </div>
      </div>

      <Card className="p-4 mb-4 border-[#C9763C]/30">
        <div className="flex items-center justify-between mb-3">
          <div><div className="text-xs text-[#DB8A4E]">{isManagement(user) ? "Sales command" : "My sales desk"}</div><div className="text-[10px] text-stone-600">Ownership, pipeline and follow-ups</div></div>
          <button onClick={() => setTab("pipeline")} className="text-[10px] text-stone-500 hover:text-[#DB8A4E]">Open pipeline →</button>
