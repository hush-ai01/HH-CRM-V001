function DispatchSection({ data, persist, log, withLog }) {
  const [filter, setFilter] = useState("active");
  const [q, setQ] = useState("");
  const [draftLocations, setDraftLocations] = useState({});
  const now = new Date();
  const completedIndex = TRIP_STEPS.length - 1;
  const isComplete = (trip) => (trip.currentStepIndex ?? 0) >= completedIndex;
  const isLate = (trip) => {
    if (!trip.eta || isComplete(trip)) return false;
    const d = new Date(trip.eta);
    return !Number.isNaN(d.getTime()) && d < now;
  };
  const truckFor = (trip) => data.trucks.find((t) => t.id === trip.truckId);
  const truckLabel = (trip) => truckFor(trip)?.reg || trip.truckManual || "Unassigned";
  const trailerLabel = (trip) => {
    if (trip.trailerManual) return trip.trailerManual;
    return trailersForTruck(truckFor(trip)).find((x) => x.id === trip.trailerId)?.registration || "No trailer assigned";
  };
  const active = data.trips.filter((t) => !isComplete(t));
  const late = data.trips.filter(isLate);
  const today = dateKey(now);
  const dueToday = active.filter((t) => [dateKey(t.dispatchDate), dateKey(t.scheduledPickup), dateKey(t.eta)].includes(today));
  const visible = data.trips
    .filter((t) => filter === "all" || (filter === "active" && !isComplete(t)) || (filter === "late" && isLate(t)) || (filter === "complete" && isComplete(t)))
    .filter((t) => `${t.dispatchRef || ""} ${truckLabel(t)} ${trailerLabel(t)} ${t.origin || ""} ${t.destination || ""} ${t.currentLocation || ""}`.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => String(a.scheduledPickup || a.dispatchDate || a.eta || "9999").localeCompare(String(b.scheduledPickup || b.dispatchDate || b.eta || "9999")));

  const updateLocation = (trip) => {
    const location = (draftLocations[trip.id] ?? trip.currentLocation ?? "").trim();
    if (!location) return;
    const updatedAt = new Date().toISOString();
    let next = { ...data, trips: data.trips.map((t) => t.id === trip.id ? { ...t, currentLocation: location, lastLocationAt: updatedAt } : t) };
    next = withLog(next, log("Updated", "Dispatch", trip.dispatchRef || truckLabel(trip), `Location: ${location}`));
    persist(next);
    setDraftLocations((prev) => ({ ...prev, [trip.id]: location }));
  };

  const advance = (trip) => {
    const current = trip.currentStepIndex ?? 0;
    const idx = Math.min(current + 1, completedIndex);
    const baseSteps = trip.steps || TRIP_STEPS.map((label, i) => ({ label, done: i <= current, at: null }));
    const steps = baseSteps.map((s, i) => i === idx ? { ...s, done: true, at: new Date().toISOString() } : s);
    let next = { ...data, trips: data.trips.map((t) => t.id === trip.id ? { ...t, steps, currentStepIndex: idx, progressPct: Math.round(((idx + 1) / TRIP_STEPS.length) * 100) } : t) };
    next = withLog(next, log("Updated", "Dispatch", trip.dispatchRef || truckLabel(trip), `Status: ${TRIP_STEPS[idx]}`));
    persist(next);
  };

  const KPI = ({ label, value, tone = "stone" }) => <Card className="p-3"><div className="text-[10px] uppercase text-stone-500">{label}</div><div className={`text-xl font-semibold mt-1 ${tone === "red" ? "text-[#B9584A]" : tone === "amber" ? "text-[#DB8A4E]" : "text-stone-100"}`}>{value}</div></Card>;

  return (
    <div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-4">
        <KPI label="Active loads" value={active.length} />
        <KPI label="Due today" value={dueToday.length} tone="amber" />
        <KPI label="Late" value={late.length} tone="red" />
        <KPI label="Completed" value={data.trips.length - active.length} />
      </div>
      <Card className="p-3 mb-4 flex flex-wrap gap-2 items-center">
        <div className="relative flex-1 min-w-[220px]"><Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" /><TextInput className="pl-9 py-1.5" placeholder="Search dispatch, truck, route or location…" value={q} onChange={(e) => setQ(e.target.value)} /></div>
        {["active", "late", "complete", "all"].map((x) => <button key={x} onClick={() => setFilter(x)} className={`text-[11px] px-2.5 py-1.5 rounded-full capitalize ${filter === x ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>{x}</button>)}
      </Card>
      {visible.length === 0 && <EmptyState label="No dispatches match this view. Add or schedule a trip first." />}
      <div className="space-y-3">
        {visible.map((trip) => {
          const truck = truckFor(trip);
          const current = trip.currentStepIndex ?? 0;
          return (
            <Card key={trip.id} className={`p-4 ${isLate(trip) ? "border-[#B9584A]/60" : ""}`}>
              <div className="flex flex-wrap items-start justify-between gap-3 mb-3">
                <div>
                  <div className="text-sm font-medium text-stone-100 flex items-center gap-1.5"><Navigation size={13} /> {trip.dispatchRef || "Dispatch not numbered"}</div>
                  <div className="text-xs text-stone-400 mt-0.5">{truckLabel(trip)} · {trailerLabel(trip)}{truck?.driver?.name ? ` · ${truck.driver.name}` : ""}</div>
                  <div className="text-xs text-stone-500">{trip.origin || "?"} → {trip.destination || "?"}</div>
                </div>
                <div className="flex items-center gap-2">{isLate(trip) && <Pill tone="red">Late</Pill>}<Pill tone={isComplete(trip) ? "green" : "amber"}>{TRIP_STEPS[current] || TRIP_STEPS[0]}</Pill></div>
              </div>
              <div className="grid sm:grid-cols-3 gap-2 mb-3 text-xs">
                <div className="bg-[#202426] rounded-lg p-2"><div className="text-[9px] uppercase text-stone-600">Scheduled pickup</div><div className="text-stone-300 mt-0.5">{formatDateTime(trip.scheduledPickup || trip.dispatchDate)}</div></div>
                <div className="bg-[#202426] rounded-lg p-2"><div className="text-[9px] uppercase text-stone-600">ETA</div><div className={isLate(trip) ? "text-[#B9584A] mt-0.5" : "text-stone-300 mt-0.5"}>{formatDateTime(trip.eta)}</div></div>
                <div className="bg-[#202426] rounded-lg p-2"><div className="text-[9px] uppercase text-stone-600">Last update</div><div className="text-stone-300 mt-0.5">{trip.lastLocationAt ? formatDateTime(trip.lastLocationAt) : "No location update"}</div></div>
              </div>
              <div className="flex flex-wrap gap-2 items-end">
                <label className="flex-1 min-w-[220px]"><span className="block text-[10px] uppercase text-stone-500 mb-1">Current location</span><TextInput className="py-1.5" value={draftLocations[trip.id] ?? trip.currentLocation ?? ""} onChange={(e) => setDraftLocations((prev) => ({ ...prev, [trip.id]: e.target.value }))} placeholder="e.g. Beitbridge border post" /></label>
                <Btn variant="subtle" onClick={() => updateLocation(trip)}><MapPin size={13} /> Update location</Btn>
                {!isComplete(trip) && <Btn variant="subtle" onClick={() => advance(trip)}>Mark {TRIP_STEPS[current + 1]}</Btn>}
                {trip.trackingUrl && <a href={trip.trackingUrl} target="_blank" rel="noreferrer" className="font-display inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[12px] font-semibold bg-[#202426] hover:bg-[#262B2D] text-stone-200"><Navigation size={13} /> Open GPS link</a>}
              </div>
              {trip.dispatcherNotes && <div className="text-[11px] text-stone-500 mt-2">Dispatch note: {trip.dispatcherNotes}</div>}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function FleetSection({ data, persist, log, withLog }) {
  const [modal, setModal] = useState(null);

  const save = (form, editing) => {
    let next = { ...data };
    const docLogs = logNewDocs(log, editing?.driver?.docs, form.driver?.docs, form.reg, "Driver documents");
    if (editing) {
      next.trucks = next.trucks.map((t) => (t.id === editing.id ? { ...t, ...form } : t));
      next = withLog(next, [log("Edited", "Truck", form.reg), ...docLogs]);
    } else {
      const truck = { ...form, id: uid("truck"), createdAt: new Date().toISOString() };
      next.trucks = [truck, ...next.trucks];
      next = withLog(next, [log("Added", "Truck", form.reg), ...docLogs]);
    }
    persist(next);
    setModal(null);
  };

  const remove = (t) => {
    if (!confirmDelete(`truck ${t.reg}`)) return;
    let next = { ...data, trucks: data.trucks.filter((x) => x.id !== t.id) };
    next = withLog(next, log("Deleted", "Truck", t.reg));
    persist(next);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs text-stone-500">{data.trucks.length} truck(s) on file</div>
        <Btn onClick={() => setModal("add")}><Plus size={14} /> Add Truck</Btn>
      </div>
      {data.trucks.length === 0 && <EmptyState label="No trucks added yet." />}
      <div className="space-y-2">
        {data.trucks.map((t) => (
          <Card key={t.id} className="p-3">
            <div className="flex items-start justify-between">
              <div>
                <div className="text-sm font-medium text-stone-100 flex items-center gap-1"><Truck size={13} /> {t.reg}</div>
                <div className="text-xs text-stone-400">{t.make} {t.model} {t.capacity ? `· ${t.capacity}` : ""}</div>
                <div className="text-xs text-stone-500 mt-0.5">{t.company || "—"}{t.owner ? ` · Owner: ${t.owner}` : ""}</div>
                <div className="text-xs text-stone-500 mt-1 flex items-center gap-1"><IdCard size={11} /> {t.driver?.name || "No driver assigned"} {t.driver?.idNumber ? `· ID ${t.driver.idNumber}` : ""}</div>
                {trailersForTruck(t).length > 0 && <div className="flex flex-wrap gap-1 mt-2">{trailersForTruck(t).map((trailer) => <span key={trailer.id} className="text-[10px] bg-[#202426] border border-[#2B2F32] px-2 py-0.5 rounded text-stone-400">Trailer {trailer.registration}{trailer.type ? ` · ${trailer.type}` : ""}</span>)}</div>}
              </div>
              <div className="flex flex-col items-end gap-1">
                <Pill tone={t.status === "In Transit" ? "amber" : t.status === "Available" ? "green" : "stone"}>{t.status}</Pill>
                <div className="flex gap-1 mt-1">
                  <button onClick={() => setModal(t)} className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
                  <button onClick={() => remove(t)} className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>
                </div>
              </div>
            </div>
            {(t.driver?.docs || []).length > 0 && (
              <div className="mt-2 flex flex-wrap gap-1">
                {t.driver.docs.map((f, i) => (
                  <span key={i} className="text-[10px] bg-[#202426] border border-[#2B2F32] px-1.5 py-0.5 rounded flex items-center gap-1 text-stone-400"><Paperclip size={10} /> {f.name}</span>
                ))}
              </div>
            )}
          </Card>
        ))}
      </div>
      {modal && <TruckModal editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

function TruckModal({ editing, onClose, onSave }) {
  const [reg, setReg] = useState(editing?.reg || "");
  const [trailers, setTrailers] = useState(trailersForTruck(editing));
  const [make, setMake] = useState(editing?.make || "");
  const [model, setModel] = useState(editing?.model || "");
  const [capacity, setCapacity] = useState(editing?.capacity || "");
  const [company, setCompany] = useState(editing?.company || "");
  const [owner, setOwner] = useState(editing?.owner || "");
  const [status, setStatus] = useState(editing?.status || TRUCK_STATUSES[0]);
  const [driverName, setDriverName] = useState(editing?.driver?.name || "");
  const [driverId, setDriverId] = useState(editing?.driver?.idNumber || "");
  const [driverPhone, setDriverPhone] = useState(editing?.driver?.phone || "");
  const [driverDocs, setDriverDocs] = useState(editing?.driver?.docs || []);

  const addTrailer = () => setTrailers((items) => [...items, { id: uid("trailer"), registration: "", type: "Side tipper", capacity: "", status: "Available" }]);
  const updateTrailer = (id, field, value) => setTrailers((items) => items.map((t) => t.id === id ? { ...t, [field]: value } : t));
  const removeTrailer = (id) => setTrailers((items) => items.filter((t) => t.id !== id));

  const submit = () => {
    onSave(
      { reg, trailerNumber: trailers[0]?.registration || "", trailers: trailers.filter((t) => t.registration.trim()), make, model, capacity, company, owner, status, driver: { name: driverName, idNumber: driverId, phone: driverPhone, docs: driverDocs } },
      editing
    );
  };

  return (
    <Modal title={editing ? "Edit Truck" : "Add Truck — full pack"} onClose={onClose} wide>
      <div className="text-xs text-[#DB8A4E] mb-2">Vehicle</div>
      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Registration number"><TextInput value={reg} onChange={(e) => setReg(e.target.value)} /></Field>
        <Field label="Make"><TextInput value={make} onChange={(e) => setMake(e.target.value)} /></Field>
        <Field label="Model"><TextInput value={model} onChange={(e) => setModel(e.target.value)} /></Field>
        <Field label="Capacity"><TextInput value={capacity} onChange={(e) => setCapacity(e.target.value)} placeholder="e.g. 34 MT" /></Field>
        <Field label="Status">
          <Select value={status} onChange={(e) => setStatus(e.target.value)}>
            {TRUCK_STATUSES.map((s) => <option key={s}>{s}</option>)}
          </Select>
        </Field>
        <Field label="Assigned company"><TextInput value={company} onChange={(e) => setCompany(e.target.value)} /></Field>
        <Field label="Assigned owner"><TextInput value={owner} onChange={(e) => setOwner(e.target.value)} /></Field>
      </div>

      <div className="flex items-center justify-between mb-2 mt-3">
        <div><div className="text-xs text-[#DB8A4E]">Trailers</div><div className="text-[10px] text-stone-500">Assign as many trailers as this truck can use.</div></div>
        <Btn variant="subtle" onClick={addTrailer}><Plus size={13} /> Add trailer</Btn>
      </div>
      {trailers.length === 0 && <div className="text-xs text-stone-600 border border-dashed border-[#2B2F32] rounded-lg p-3 mb-3">No trailers added.</div>}
      <div className="space-y-2 mb-3">
        {trailers.map((trailer, index) => (
          <div key={trailer.id} className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3">
            <div className="flex items-center justify-between mb-2"><span className="text-[10px] uppercase text-stone-500">Trailer {index + 1}</span><button onClick={() => removeTrailer(trailer.id)} className="text-stone-500 hover:text-red-400"><Trash2 size={13} /></button></div>
            <div className="grid sm:grid-cols-2 gap-2">
              <Field label="Trailer registration"><TextInput value={trailer.registration} onChange={(e) => updateTrailer(trailer.id, "registration", e.target.value)} /></Field>
              <Field label="Type"><TextInput value={trailer.type} onChange={(e) => updateTrailer(trailer.id, "type", e.target.value)} placeholder="e.g. Side tipper" /></Field>
              <Field label="Capacity"><TextInput value={trailer.capacity} onChange={(e) => updateTrailer(trailer.id, "capacity", e.target.value)} placeholder="e.g. 34t" /></Field>
              <Field label="Status"><Select value={trailer.status} onChange={(e) => updateTrailer(trailer.id, "status", e.target.value)}><option>Available</option><option>Assigned</option><option>Maintenance</option></Select></Field>
            </div>
          </div>
        ))}
      </div>

      <div className="text-xs text-[#DB8A4E] mb-2 mt-3">Driver</div>
      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Driver name"><TextInput value={driverName} onChange={(e) => setDriverName(e.target.value)} /></Field>
        <Field label="Driver ID number"><TextInput value={driverId} onChange={(e) => setDriverId(e.target.value)} /></Field>
        <Field label="Driver phone"><TextInput value={driverPhone} onChange={(e) => setDriverPhone(e.target.value)} /></Field>
      </div>
      <UploadArea label="Driver documents (license, PDP, ID)" files={driverDocs} onAdd={(fs) => setDriverDocs((d) => [...d, ...fs])} onRemove={(i) => setDriverDocs((d) => d.filter((_, idx) => idx !== i))} />

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn disabled={!reg.trim()} onClick={submit}>{editing ? "Save changes" : "Add truck"}</Btn>
      </div>
    </Modal>
  );
}

function TripsSection({ data, persist, log, withLog }) {
  const [modal, setModal] = useState(null);

  const truckLabel = (id, manual = "") => data.trucks.find((t) => t.id === id)?.reg || manual || "Unassigned";
  const trailerLabel = (trip) => {
    if (trip.trailerManual) return trip.trailerManual;
    const truck = data.trucks.find((t) => t.id === trip.truckId);
    return trailersForTruck(truck).find((x) => x.id === trip.trailerId)?.registration || "";
  };
  const dealLabel = (id) => {
    const d = data.deals.find((x) => x.id === id);
    if (!d) return "—";
    return d.dealRef || d.clientManual || data.clients.find((c) => c.id === d.clientId)?.name || "Deal";
  };

  const save = (form, editing) => {
    let next = { ...data };
    const docLogs = [
      ...logNewDocs(log, editing?.weighbridgeSlip ? [editing.weighbridgeSlip] : [], form.weighbridgeSlip ? [form.weighbridgeSlip] : [], truckLabel(form.truckId, form.truckManual), "Weighbridge slip"),
      ...logNewDocs(log, editing?.assayReport ? [editing.assayReport] : [], form.assayReport ? [form.assayReport] : [], truckLabel(form.truckId, form.truckManual), "Assay report"),
    ];
    if (editing) {
      next.trips = next.trips.map((t) => (t.id === editing.id ? { ...t, ...form } : t));
      next = withLog(next, [log("Edited", "Trip", form.dispatchRef || truckLabel(form.truckId, form.truckManual)), ...docLogs]);
    } else {
      const trip = { ...form, id: uid("trip"), createdAt: new Date().toISOString() };
      next.trips = [trip, ...next.trips];
      next = withLog(next, [log("Added", "Trip", form.dispatchRef || truckLabel(form.truckId, form.truckManual)), ...docLogs]);
    }
    persist(next);
    setModal(null);
  };

  const remove = (t) => {
    if (!confirmDelete(`trip ${t.dispatchRef || truckLabel(t.truckId, t.truckManual)}`)) return;
    let next = { ...data, trips: data.trips.filter((x) => x.id !== t.id) };
    next = withLog(next, log("Deleted", "Trip", t.dispatchRef || truckLabel(t.truckId, t.truckManual)));
    persist(next);
  };

  const advance = (trip) => {
    const current = trip.currentStepIndex ?? 0;
    const idx = Math.min(current + 1, TRIP_STEPS.length - 1);
    const baseSteps = trip.steps || TRIP_STEPS.map((label, i) => ({ label, done: i <= current, at: null }));
    const steps = baseSteps.map((s, i) => (i === idx ? { ...s, done: true, at: new Date().toISOString() } : s));
    let next = { ...data, trips: data.trips.map((t) => (t.id === trip.id ? { ...t, steps, currentStepIndex: idx, progressPct: Math.round(((idx + 1) / TRIP_STEPS.length) * 100) } : t)) };
    next = withLog(next, log("Edited", "Trip", `${trip.dispatchRef || truckLabel(trip.truckId, trip.truckManual)} → ${TRIP_STEPS[idx]}`));
    persist(next);
  };

  const [exportDeal, setExportDeal] = useState("");

  const exportTruckList = () => {
    const rows = (exportDeal ? data.trips.filter((t) => t.dealId === exportDeal) : data.trips).map((t) => {
      const truck = data.trucks.find((x) => x.id === t.truckId);
      const dry = t.netWeight && t.moisturePct ? (Number(t.netWeight) * (1 - Number(t.moisturePct) / 100)).toFixed(2) : t.netWeight || "";
      return {
        "Truck Reg": truck?.reg || t.truckManual || "—",
        "Trailer Reg": trailerLabel(t) || "—",
        "Driver": truck?.driver?.name || "—",
        "Driver Phone": truck?.driver?.phone || "—",
        "Deal": dealLabel(t.dealId),
        "Origin": t.origin || "",
        "Destination": t.destination || "",
        "Gross Wt (t)": t.grossWeight || "",
        "Tare Wt (t)": t.tareWeight || "",
        "Net Wt (t)": t.netWeight || "",
        "Moisture %": t.moisturePct || "",
        "Dry Wt (t)": dry,
        "Grade": t.grade || "",
        "Status": TRIP_STEPS[t.currentStepIndex] || "",
        "Dispatch Ref": t.dispatchRef || "",
        "Scheduled Pickup": t.scheduledPickup || t.dispatchDate || "",
        "Current Location": t.currentLocation || "",
        "Last Location Update": t.lastLocationAt || "",
        "ETA": t.eta || "",
      };
    });
    if (!rows.length) return;
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Truck List");
    const dealTag = exportDeal ? dealLabel(exportDeal).replace(/[^\w-]+/g, "_") : "All_Deals";
    XLSX.writeFile(wb, `Truck_List_${dealTag}_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="text-xs text-stone-500 flex items-center">
          Track each load like a parcel — step through its journey.
          <InfoTip text="Each trip is one truck load. Capture the weighbridge slip and assay report here so invoicing can pull the moisture-adjusted weight automatically." />
        </div>
        <Btn onClick={() => setModal("add")}><Plus size={14} /> Add Trip</Btn>
      </div>

      <Card className="p-3 mb-4 flex items-center gap-2 flex-wrap">
        <Sheet size={14} className="text-[#DB8A4E]" />
        <span className="text-xs text-stone-400">Export a truck list for stakeholders:</span>
        <Select className="w-auto text-xs py-1.5" value={exportDeal} onChange={(e) => setExportDeal(e.target.value)}>
          <option value="">All deals</option>
          {data.deals.map((d) => <option key={d.id} value={d.id}>{dealLabel(d.id)}</option>)}
        </Select>
        <Btn variant="subtle" onClick={exportTruckList}><Sheet size={13} /> Export to Excel</Btn>
      </Card>

      {data.trips.length === 0 && <EmptyState label="No trips logged yet." />}
      <div className="space-y-3">
        {data.trips.map((t) => {
          const dry = t.netWeight && t.moisturePct ? (Number(t.netWeight) * (1 - Number(t.moisturePct) / 100)).toFixed(2) : null;
          return (
            <Card key={t.id} className="p-3">
              <div className="flex items-start justify-between mb-2">
                <div>
                  <div className="text-sm font-medium text-stone-100 flex items-center gap-1"><Truck size={13} /> {t.dispatchRef ? `${t.dispatchRef} · ` : ""}{truckLabel(t.truckId, t.truckManual)}{trailerLabel(t) ? ` / ${trailerLabel(t)}` : ""}</div>
                  <div className="text-xs text-stone-500">{t.origin || "?"} → {t.destination || "?"} · {dealLabel(t.dealId)}</div>
                  {t.eta && <div className="text-xs text-stone-600">ETA {formatDateTime(t.eta)}</div>}
                  {t.currentLocation && <div className="text-xs text-[#DB8A4E] flex items-center gap-1 mt-0.5"><MapPin size={10} /> {t.currentLocation}</div>}
                  {(t.netWeight || t.moisturePct) && (
                    <div className="text-xs text-stone-400 mt-1 flex items-center gap-1 flex-wrap">
                      {t.grossWeight && <span>Gross {t.grossWeight}t</span>}
                      {t.tareWeight && <span>· Tare {t.tareWeight}t</span>}
                      {t.netWeight && <span>· Net {t.netWeight}t</span>}
                      {t.moisturePct && <span>· Moisture {t.moisturePct}%</span>}
                      {dry && <Pill tone="green">Dry wt {dry}t</Pill>}
                    </div>
                  )}
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setModal(t)} className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
                  <button onClick={() => remove(t)} className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>
                </div>
              </div>
              <div className="w-full h-1.5 bg-[#202426] rounded-full overflow-hidden mb-2">
                <div className="h-full bg-[#C9763C] transition-all" style={{ width: `${t.progressPct || 0}%` }} />
              </div>
              <div className="flex flex-wrap gap-2">
                {TRIP_STEPS.map((s, i) => (
                  <div key={s} className={`flex items-center gap-1 text-[10px] px-2 py-1 rounded-full ${i <= t.currentStepIndex ? "bg-[#C9763C]/15 text-[#DB8A4E] border border-[#C9763C]/30" : "bg-[#202426] text-stone-600 border border-[#2B2F32]"}`}>
                    {i <= t.currentStepIndex && <Check size={10} />} {s}
                  </div>
                ))}
              </div>
              {t.currentStepIndex < TRIP_STEPS.length - 1 && (
                <Btn variant="subtle" className="mt-2" onClick={() => advance(t)}>Mark next step: {TRIP_STEPS[t.currentStepIndex + 1]}</Btn>
              )}
            </Card>
          );
        })}
      </div>
      {modal && <TripModal data={data} editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

function TripModal({ data, editing, onClose, onSave }) {
  const [truckMode, setTruckMode] = useState(editing?.truckManual ? "manual" : "select");
  const [truckId, setTruckId] = useState(editing?.truckId || "");
  const [truckManual, setTruckManual] = useState(editing?.truckManual || "");
  const [trailerId, setTrailerId] = useState(editing?.trailerId || "");
  const [trailerManual, setTrailerManual] = useState(editing?.trailerManual || "");
  const [dealId, setDealId] = useState(editing?.dealId || "");
  const [origin, setOrigin] = useState(editing?.origin || "");
  const [destination, setDestination] = useState(editing?.destination || "");
  const [eta, setEta] = useState(editing?.eta || "");
  const [dispatchRef, setDispatchRef] = useState(editing?.dispatchRef || "");
  const [dispatchDate, setDispatchDate] = useState(editing?.dispatchDate || "");
  const [scheduledPickup, setScheduledPickup] = useState(editing?.scheduledPickup || "");
  const [currentLocation, setCurrentLocation] = useState(editing?.currentLocation || "");
  const [trackingUrl, setTrackingUrl] = useState(editing?.trackingUrl || "");
  const [dispatcherNotes, setDispatcherNotes] = useState(editing?.dispatcherNotes || "");

  const [grossWeight, setGrossWeight] = useState(editing?.grossWeight || "");
  const [tareWeight, setTareWeight] = useState(editing?.tareWeight || "");
  const [netWeight, setNetWeight] = useState(editing?.netWeight || "");
  const [moisturePct, setMoisturePct] = useState(editing?.moisturePct || "");
  const [grade, setGrade] = useState(editing?.grade || "");
  const [weighbridgeSlip, setWeighbridgeSlip] = useState(editing?.weighbridgeSlip || null);
  const [assayReport, setAssayReport] = useState(editing?.assayReport || null);
  const [extracting, setExtracting] = useState(null); // 'weighbridge' | 'assay' | null
  const [extractNote, setExtractNote] = useState("");

  const dryWeight = netWeight && moisturePct ? (Number(netWeight) * (1 - Number(moisturePct) / 100)).toFixed(2) : null;
  const selectedTruck = data.trucks.find((t) => t.id === truckId);
  const availableTrailers = trailersForTruck(selectedTruck);

  const uploadWeighbridge = async (fs) => {
    const f = fs[0];
    if (!f) return;
    setWeighbridgeSlip(f);
  };
  const uploadAssay = async (fs) => {
    const f = fs[0];
    if (!f) return;
    setAssayReport(f);
  };

  const runExtract = async (kind) => {
    const file = kind === "weighbridge" ? weighbridgeSlip : assayReport;
    if (!file || file.tooLarge) {
      setExtractNote("Upload a smaller file (under ~1.5MB) before running AI extraction.");
      return;
    }
    setExtracting(kind);
    setExtractNote("");
    const result = await aiExtractDocument(file, kind);
    setExtracting(null);
    if (!result) {
      setExtractNote("Couldn't read that document automatically — please fill the fields in manually.");
      return;
    }
    if (kind === "weighbridge") {
      if (result.grossWeight != null) setGrossWeight(String(result.grossWeight));
      if (result.tareWeight != null) setTareWeight(String(result.tareWeight));
      if (result.netWeight != null) setNetWeight(String(result.netWeight));
      else if (result.grossWeight != null && result.tareWeight != null) setNetWeight(String(result.grossWeight - result.tareWeight));
      setExtractNote("Filled in from the weighbridge slip — please double-check against the original before saving.");
    } else {
      if (result.grade != null) setGrade(String(result.grade));
      if (result.moisturePct != null) setMoisturePct(String(result.moisturePct));
      setExtractNote("Filled in from the assay report — please double-check against the original before saving.");
    }
  };

  const submit = () => {
    const steps = editing?.steps || TRIP_STEPS.map((label, i) => ({ label, done: i === 0, at: i === 0 ? new Date().toISOString() : null }));
    onSave(
      {
        truckId: truckMode === "select" ? truckId : "",
        truckManual: truckMode === "manual" ? truckManual : "",
        trailerId: truckMode === "select" ? trailerId : "",
        trailerManual: truckMode === "manual" ? trailerManual : "",
        dealId, origin, destination, eta, dispatchRef, dispatchDate, scheduledPickup,
        currentLocation, trackingUrl, dispatcherNotes,
        lastLocationAt: currentLocation && currentLocation !== (editing?.currentLocation || "") ? new Date().toISOString() : (editing?.lastLocationAt || ""),
        grossWeight, tareWeight, netWeight, moisturePct, grade,
        weighbridgeSlip, assayReport,
        steps, currentStepIndex: editing?.currentStepIndex ?? 0, progressPct: editing?.progressPct ?? Math.round((1 / TRIP_STEPS.length) * 100),
      },
      editing
    );
  };

  return (
    <Modal title={editing ? "Edit Trip" : "Add Trip"} onClose={onClose} wide>
      <div className="flex items-center justify-between mb-1">
        <span className="block text-xs uppercase tracking-wide text-stone-400">Truck</span>
        <div className="flex gap-1">
          <button onClick={() => setTruckMode("select")} className={`text-[11px] px-2 py-0.5 rounded-full ${truckMode === "select" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>From fleet</button>
          <button onClick={() => setTruckMode("manual")} className={`text-[11px] px-2 py-0.5 rounded-full ${truckMode === "manual" ? "bg-[#C9763C] text-[#141617]" : "bg-[#202426] text-stone-400"}`}>Add manually</button>
        </div>
      </div>
      {truckMode === "select" ? (
        <Select className="mb-3" value={truckId} onChange={(e) => { setTruckId(e.target.value); setTrailerId(""); }}>
          <option value="">— select truck —</option>
          {data.trucks.map((t) => <option key={t.id} value={t.id}>{t.reg} — {t.driver?.name || "no driver"}</option>)}
        </Select>
      ) : (
        <TextInput className="mb-3" value={truckManual} onChange={(e) => setTruckManual(e.target.value)} placeholder="Truck reg / description" />
      )}
      {truckMode === "select" ? (
        <Field label="Assigned trailer">
          <Select value={trailerId} onChange={(e) => setTrailerId(e.target.value)}>
            <option value="">— no trailer / assign later —</option>
            {availableTrailers.map((t) => <option key={t.id} value={t.id}>{t.registration}{t.type ? ` — ${t.type}` : ""}{t.status ? ` (${t.status})` : ""}</option>)}
          </Select>
        </Field>
      ) : (
        <Field label="Trailer registration"><TextInput value={trailerManual} onChange={(e) => setTrailerManual(e.target.value)} /></Field>
      )}

      <div className="border-t border-[#2B2F32] pt-3 mt-1 mb-3">
        <div className="text-xs text-[#DB8A4E] mb-2">Dispatch tracking</div>
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Dispatch reference"><TextInput value={dispatchRef} onChange={(e) => setDispatchRef(e.target.value)} placeholder="e.g. DSP-2026-001" /></Field>
          <Field label="Dispatch date"><TextInput type="datetime-local" value={dispatchDate} onInput={(e) => setDispatchDate(e.target.value)} onChange={(e) => setDispatchDate(e.target.value)} /></Field>
          <Field label="Scheduled pickup"><TextInput type="datetime-local" value={scheduledPickup} onInput={(e) => setScheduledPickup(e.target.value)} onChange={(e) => setScheduledPickup(e.target.value)} /></Field>
          <Field label="ETA"><TextInput type="datetime-local" value={eta} onInput={(e) => setEta(e.target.value)} onChange={(e) => setEta(e.target.value)} /></Field>
        </div>
        <Field label="Current location"><TextInput value={currentLocation} onChange={(e) => setCurrentLocation(e.target.value)} placeholder="e.g. Chirundu border post" /></Field>
        <Field label="GPS / tracking link (optional)"><TextInput type="url" value={trackingUrl} onChange={(e) => setTrackingUrl(e.target.value)} placeholder="https://…" /></Field>
        <Field label="Dispatcher notes / driver instructions"><TextArea rows={2} value={dispatcherNotes} onChange={(e) => setDispatcherNotes(e.target.value)} /></Field>
      </div>
      <Field label="Linked deal">
        <Select value={dealId} onChange={(e) => setDealId(e.target.value)}>
          <option value="">— none —</option>
          {data.deals.map((d) => <option key={d.id} value={d.id}>{d.dealRef || d.clientManual || "Deal"}</option>)}
        </Select>
      </Field>
      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Origin"><TextInput value={origin} onChange={(e) => setOrigin(e.target.value)} /></Field>
        <Field label="Destination"><TextInput value={destination} onChange={(e) => setDestination(e.target.value)} /></Field>
      </div>

      <div className="border-t border-[#2B2F32] my-3 pt-3">
        <div className="text-xs text-[#DB8A4E] mb-2 flex items-center">
          Weighbridge slip
          <InfoTip text="Upload a photo or PDF of the weighbridge ticket, then hit 'Read with AI' to auto-fill the weights. Always verify the numbers before saving." />
        </div>
        <UploadArea label="Upload weighbridge slip (photo or PDF)" files={weighbridgeSlip ? [weighbridgeSlip] : []} onAdd={uploadWeighbridge} onRemove={() => setWeighbridgeSlip(null)} accept="application/pdf,image/*" />
        {weighbridgeSlip && (
          <Btn variant="subtle" className="mb-3" onClick={() => runExtract("weighbridge")} disabled={extracting === "weighbridge"}>
            {extracting === "weighbridge" ? <Loader2 size={13} className="animate-spin" /> : <Scan size={13} />}
            {extracting === "weighbridge" ? "Reading slip…" : "Read with AI"}
          </Btn>
        )}
        <div className="grid sm:grid-cols-3 gap-2">
          <Field label="Gross wt (t)"><TextInput value={grossWeight} onChange={(e) => setGrossWeight(e.target.value)} /></Field>
          <Field label="Tare wt (t)"><TextInput value={tareWeight} onChange={(e) => setTareWeight(e.target.value)} /></Field>
          <Field label="Net wt (t)"><TextInput value={netWeight} onChange={(e) => setNetWeight(e.target.value)} /></Field>
        </div>

        <div className="text-xs text-[#DB8A4E] mb-2 mt-3 flex items-center">
          Assay report
          <InfoTip text="Upload the lab assay report to capture grade and moisture — moisture is used to work out the dry (payable) weight for invoicing." />
        </div>
        <UploadArea label="Upload assay report (photo or PDF)" files={assayReport ? [assayReport] : []} onAdd={uploadAssay} onRemove={() => setAssayReport(null)} accept="application/pdf,image/*" />
        {assayReport && (
          <Btn variant="subtle" className="mb-3" onClick={() => runExtract("assay")} disabled={extracting === "assay"}>
            {extracting === "assay" ? <Loader2 size={13} className="animate-spin" /> : <Scan size={13} />}
            {extracting === "assay" ? "Reading report…" : "Read with AI"}
          </Btn>
        )}
        <div className="grid sm:grid-cols-2 gap-2">
          <Field label="Assayed grade"><TextInput value={grade} onChange={(e) => setGrade(e.target.value)} placeholder="e.g. 41.2%" /></Field>
          <Field label="Moisture %"><TextInput value={moisturePct} onChange={(e) => setMoisturePct(e.target.value)} placeholder="e.g. 8.5" /></Field>
        </div>

        {extractNote && (
          <div className="text-[11px] text-[#DB8A4E] flex items-start gap-1 mb-2">
            <AlertCircle size={11} className="mt-0.5 flex-shrink-0" /> {extractNote}
          </div>
        )}
        {dryWeight && (
          <div className="text-xs text-stone-300 bg-[#202426] border border-[#2B2F32] rounded-lg px-3 py-2">
            Moisture-adjusted (dry, payable) weight: <span className="text-[#DB8A4E] font-medium">{dryWeight} t</span>
          </div>
        )}
      </div>

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit}>{editing ? "Save changes" : "Add trip"}</Btn>
      </div>
    </Modal>
  );
}

function InvoicesSection({ data, persist, log, withLog }) {
  const [modal, setModal] = useState(null);

  const dealLabel = (id) => {
    const d = data.deals.find((x) => x.id === id);
    if (!d) return "—";
    return d.dealRef || d.clientManual || data.clients.find((c) => c.id === d.clientId)?.name || "Deal";
  };

  const save = (form, editing) => {
    let next = { ...data };
    const label = form.invoiceNumber || dealLabel(form.dealId) || "Invoice";
    const fileLog =
      form.file?.name && form.file?.name !== editing?.file?.name
        ? [log("Uploaded", "Document", form.file.name, `Invoice file — ${label}`)]
        : [];
    if (editing) {
      next.invoices = next.invoices.map((i) => (i.id === editing.id ? { ...i, ...form } : i));
      next = withLog(next, [log("Edited", "Invoice", form.invoiceNumber || dealLabel(form.dealId)), ...fileLog]);
    } else {
      const inv = { ...form, id: uid("inv"), createdAt: new Date().toISOString() };
      next.invoices = [inv, ...next.invoices];
      next = withLog(next, [log("Added", "Invoice", form.invoiceNumber || dealLabel(form.dealId)), ...fileLog]);
    }
    persist(next);
    setModal(null);
  };

  const remove = (i) => {
    if (!confirmDelete(`invoice ${i.invoiceNumber || dealLabel(i.dealId)}`)) return;
    let next = { ...data, invoices: data.invoices.filter((x) => x.id !== i.id) };
    next = withLog(next, log("Deleted", "Invoice", i.invoiceNumber || dealLabel(i.dealId)));
    persist(next);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs text-stone-500">{data.invoices.length} invoice(s)</div>
        <Btn onClick={() => setModal("add")}><Plus size={14} /> Add Invoice</Btn>
      </div>
      {data.invoices.length === 0 && <EmptyState label="No invoices yet." />}
      <div className="space-y-2">
        {data.invoices.map((i) => (
          <Card key={i.id} className="p-3 flex items-start justify-between">
            <div>
              <div className="text-sm font-medium text-stone-100">{i.invoiceNumber || "Untitled invoice"}</div>
              <div className="text-xs text-stone-400">{dealLabel(i.dealId)}</div>
              <div className="text-xs text-stone-500">{i.currency}{i.amount} {i.date ? `· ${i.date}` : ""}</div>
              {i.file?.name && <div className="text-[10px] text-stone-500 mt-1 flex items-center gap-1"><Paperclip size={10} /> {i.file.name} {i.mode === "upload" && <Pill tone="blue">uploaded</Pill>}</div>}
            </div>
            <div className="flex gap-1">
              <button onClick={() => setModal(i)} className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
              <button onClick={() => remove(i)} className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>
            </div>
          </Card>
        ))}
      </div>
      {modal && <InvoiceModal data={data} editing={modal === "add" ? null : modal} onClose={() => setModal(null)} onSave={save} />}
    </div>
  );
}

function InvoiceModal({ data, editing, onClose, onSave }) {
  const [mode, setMode] = useState(editing?.mode || "manual");
  const [dealId, setDealId] = useState(editing?.dealId || "");
  const [invoiceNumber, setInvoiceNumber] = useState(editing?.invoiceNumber || "");
  const [amount, setAmount] = useState(editing?.amount || "");
  const [currency, setCurrency] = useState(editing?.currency || "$");
  const [date, setDate] = useState(editing?.date || "");
  const [notes, setNotes] = useState(editing?.notes || "");
  const [file, setFile] = useState(editing?.file || null);
  const [quickFilled, setQuickFilled] = useState(false);

  // Autonomy: once a deal is linked, pull who it's for and what it's worth straight from
  // that deal record — amount/currency stay a one-click "Use" away, never forced.
  const selectedDeal = data.deals.find((d) => d.id === dealId);
  const selectedDealClientName = selectedDeal
    ? selectedDeal.clientManual || data.clients.find((c) => c.id === selectedDeal.clientId)?.name || "—"
    : null;

  // Prefer the moisture-adjusted (dry, payable) weight from actual truck loads over the
  // deal's nominal quantity, when weighbridge + assay data has been captured for this deal.
  const dealTrips = dealId ? data.trips.filter((t) => t.dealId === dealId) : [];
  const tripsWithWeight = dealTrips.filter((t) => t.netWeight);
  const dryWeightTotal = tripsWithWeight.length
    ? tripsWithWeight.reduce((sum, t) => {
        const dry = t.moisturePct ? Number(t.netWeight) * (1 - Number(t.moisturePct) / 100) : Number(t.netWeight);
        return sum + dry;
      }, 0)
    : null;
  const effectiveQty = dryWeightTotal != null ? dryWeightTotal : Number(selectedDeal?.quantity) || null;
  const computedTotal = selectedDeal && effectiveQty > 0 && Number(selectedDeal.price) > 0
    ? effectiveQty * Number(selectedDeal.price)
    : null;

  const handleUpload = async (fs) => {
    const f = fs[0];
    if (!f) return;
    setFile(f);
    // best-effort quick-fill from filename — not real OCR
    const guessNum = f.name.match(/(INV|INVOICE)[-_ ]?(\w+)/i);
    const guessAmt = f.name.match(/(\d{3,})(?=\D*$)/);
    if (guessNum && !invoiceNumber) setInvoiceNumber(guessNum[0].toUpperCase());
    if (guessAmt && !amount) setAmount(guessAmt[1]);
    setQuickFilled(true);
  };

  const submit = () => onSave({ mode, dealId, invoiceNumber, amount, currency, date, notes, file }, editing);

  return (
    <Modal title={editing ? "Edit Invoice" : "Add Invoice"} onClose={onClose} wide>
      <div className="flex gap-1 mb-3">
        <button onClick={() => setMode("manual")} className={`text-xs px-3 py-1.5 rounded-full border ${mode === "manual" ? "bg-[#C9763C] text-[#141617] border-[#C9763C] font-medium" : "border-[#2B2F32] text-stone-400"}`}>Manual entry</button>
        <button onClick={() => setMode("upload")} className={`text-xs px-3 py-1.5 rounded-full border ${mode === "upload" ? "bg-[#C9763C] text-[#141617] border-[#C9763C] font-medium" : "border-[#2B2F32] text-stone-400"}`}>Upload invoice</button>
      </div>

      {mode === "upload" && (
        <div className="mb-2">
          <UploadArea label="Upload invoice file (PDF or image)" files={file ? [file] : []} onAdd={handleUpload} onRemove={() => setFile(null)} accept="application/pdf,image/*" />
          {quickFilled && (
            <div className="text-[11px] text-[#DB8A4E] flex items-center gap-1 mb-2">
              <AlertCircle size={11} /> Quick-filled a guess from the filename below — please check it against the actual invoice before saving.
            </div>
          )}
        </div>
      )}

      <Field label="Linked deal">
        <Select value={dealId} onChange={(e) => setDealId(e.target.value)}>
          <option value="">— none —</option>
          {data.deals.map((d) => <option key={d.id} value={d.id}>{d.dealRef || d.clientManual || "Deal"}</option>)}
        </Select>
      </Field>

      {selectedDeal && (
        <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3 text-xs">
          <div className="text-[#DB8A4E] mb-1.5">Pulled from this deal</div>
          <div className="text-stone-400">
            Billing: {selectedDealClientName}
            {selectedDeal.price ? ` · ${selectedDeal.currency || "$"}${selectedDeal.price}/${selectedDeal.unit || "MT"}` : ""}
          </div>
          {dryWeightTotal != null ? (
            <div className="text-stone-400 mt-1 flex items-center gap-1">
              <Pill tone="green">{tripsWithWeight.length} load(s) weighed</Pill>
              Moisture-adjusted total: {dryWeightTotal.toFixed(2)} {selectedDeal.unit || "MT"}
            </div>
          ) : (
            <div className="text-stone-500 mt-1">
              {selectedDeal.quantity ? `Nominal deal quantity: ${selectedDeal.quantity}${selectedDeal.unit || "MT"} (no weighed loads linked yet)` : "No weight on file yet"}
            </div>
          )}
          {computedTotal !== null && (
            <div className="flex items-center gap-2 mt-1 text-stone-400">
              <span>Computed total: {selectedDeal.currency || "$"}{computedTotal.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
              <button
                type="button"
                onClick={() => { setAmount(String(computedTotal.toFixed(2))); setCurrency(selectedDeal.currency || "$"); }}
                className="text-[10px] text-[#DB8A4E] hover:text-[#E7A874]"
              >
                Use this amount
              </button>
            </div>
          )}
        </div>
      )}

      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Invoice number"><TextInput value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} /></Field>
        <Field label="Date"><TextInput value={date} onChange={(e) => setDate(e.target.value)} placeholder="YYYY-MM-DD" /></Field>
      </div>
      <Field label="Amount">
        <div className="flex gap-1">
          <TextInput className="w-14" value={currency} onChange={(e) => setCurrency(e.target.value)} />
          <TextInput value={amount} onChange={(e) => setAmount(e.target.value)} />
        </div>
      </Field>
      <Field label="Notes"><TextArea rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit}>{editing ? "Save changes" : "Add invoice"}</Btn>
      </div>
    </Modal>
  );
}

function PipelineTab({ data, persist, log, withLog, user, users }) {
  const [modal, setModal] = useState(null);
  const [activityTarget, setActivityTarget] = useState(null);
  const [q, setQ] = useState("");
  const [scope, setScope] = useState(isManagement(user) ? "all" : "mine");
  const accessible = (data.buyerPipeline || []).filter((b) => canViewRecord(user, b));
  const scoped = scope === "mine" ? accessible.filter((b) => ownerKey(b) === userKey(user)) : accessible;
  const filtered = scoped.filter((b) => `${b.name} ${b.country} ${(b.commodities || []).join(" ")} ${b.stage} ${b.contactName || ""}`.toLowerCase().includes(q.toLowerCase()));

  const saveBuyer = (form, editing) => {
    const dupe = duplicateRecord([...(data.buyerPipeline || []), ...data.clients], form, editing?.id);
    if (dupe) return alert("This organisation may already exist in Highlands. Ask Management to check the existing relationship before creating a duplicate.");
    let next = { ...data };
    const key = userKey(user);
    const enriched = editing ? { ...form } : { ...form, createdByUserId: key, originatorUserId: key, ownerUserId: form.ownerUserId || key, visibility: form.visibility || "Private", relationshipSource: form.relationshipSource || "Salesperson Introduced" };
    if (editing) { next.buyerPipeline = next.buyerPipeline.map((b) => b.id === editing.id ? { ...b, ...enriched } : b); next = withLog(next, log("Edited", "Buyer Lead", enriched.name)); }
    else { const buyer = { ...enriched, id: uid("buyer"), createdAt: new Date().toISOString() }; next.buyerPipeline = [buyer, ...next.buyerPipeline]; next = withLog(next, log("Added", "Buyer Lead", enriched.name)); }
    persist(next); setModal(null);
  };

  const removeBuyer = (b) => {
    if (!isManagement(user)) return alert("Only Management can delete buyer leads. Mark the lead Lost instead.");
    if (!confirmDelete(`buyer lead ${b.name}`)) return;
    let next = { ...data, buyerPipeline: data.buyerPipeline.filter((x) => x.id !== b.id) }; next = withLog(next, log("Deleted", "Buyer Lead", b.name)); persist(next);
  };

  const convertToClient = (b) => {
    const existing = duplicateRecord(data.clients, { name: b.name, contactEmail: b.contactEmail, contactPhone: b.contactPhone }, null);
    if (existing) return alert("A matching client already exists in Highlands. Ask Management to review the existing account instead of creating a duplicate.");
    const client = { id: uid("client"), name: b.name, type: "Buyer", area: b.country || "", grades: [], monthlyQty: "", weeklyQty: "", contactName: b.contactName || "", contactPhone: b.contactPhone || "", contactEmail: b.contactEmail || "", kyc: [], docs: [], createdAt: new Date().toISOString(), sourceLeadId: b.id, createdByUserId: b.createdByUserId || userKey(user), originatorUserId: b.originatorUserId || userKey(user), ownerUserId: b.ownerUserId || userKey(user), visibility: b.visibility || "Private", accountStatus: "Active", nextAction: b.nextAction || "", nextActionAt: b.nextActionAt || "", lastContactAt: b.lastContactAt || "" };
    let next = { ...data, clients: [client, ...data.clients], buyerPipeline: data.buyerPipeline.map((x) => x.id === b.id ? { ...x, stage: "Converted", convertedAt: new Date().toISOString(), convertedClientId: client.id } : x) };
    next = withLog(next, log("Converted", "Buyer Lead", `${b.name} → Client`)); persist(next);
  };

  const saveActivity = (form) => {
    const now = new Date().toISOString();
    const activity = { ...form, id: uid("act"), userId: userKey(user), buyerLeadId: activityTarget.id, recordType: "Buyer Lead", recordId: activityTarget.id, occurredAt: now, createdAt: now };
    let next = { ...data, activities: [activity, ...(data.activities || [])], buyerPipeline: data.buyerPipeline.map((b) => b.id === activityTarget.id ? { ...b, lastContactAt: now, nextAction: form.nextAction || b.nextAction || "", nextActionAt: form.nextActionAt || b.nextActionAt || "" } : b) };
    if (form.nextAction && form.nextActionAt) { const d = new Date(form.nextActionAt); next.calendarEvents = [{ id: uid("event"), title: `${form.nextAction} · ${activityTarget.name}`, date: dateKey(d), time: form.nextActionAt.slice(11,16), type: "Follow-up", notes: `Buyer lead follow-up · ${activityTarget.name}`, completed: false, ownerUserId: userKey(user), linkedEntityType: "Buyer Lead", linkedEntityId: activityTarget.id, createdAt: now }, ...(next.calendarEvents || [])]; }
    next = withLog(next, log("Logged", "Sales Activity", `${form.type} · ${activityTarget.name}`, form.outcome)); persist(next); setActivityTarget(null);
  };

  return <div>
    <PageHeader eyebrow="Leads" title="Buyer Pipeline" subtitle={isManagement(user) ? "Company buyer pipeline, ownership and follow-up" : "Your buyer leads and next actions"} action={<Btn onClick={() => setModal("add")}><Plus size={14} /> Add Buyer Lead</Btn>} />
    <div className="flex flex-col sm:flex-row gap-2 mb-5"><div className="relative flex-1"><Search size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500" /><TextInput className="pl-10 py-2.5" placeholder="Search by name, country or commodity…" value={q} onChange={(e) => setQ(e.target.value)} /></div>{isManagement(user) && <div className="flex gap-1 bg-[#1C1F21] border border-[#2B2F32] rounded-lg p-1"><button onClick={() => setScope("mine")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "mine" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>Mine</button><button onClick={() => setScope("all")} className={`px-3 py-1.5 rounded-md text-[11px] ${scope === "all" ? "bg-[#C9763C] text-[#141617]" : "text-stone-400"}`}>All</button></div>}</div>
    {filtered.length === 0 && <EmptyState label={scope === "mine" ? "No buyer leads in your book yet." : "No buyer leads yet."} />}
    <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">{filtered.map((b) => { const due=dueState(b.nextActionAt); const acts=(data.activities || []).filter((a)=>a.buyerLeadId===b.id); return <Card key={b.id} className={`p-4 ${due === "overdue" ? "border-[#B9584A]/50" : ""}`}>
      <div className="flex items-start justify-between"><div className="min-w-0"><div className="text-sm font-medium text-stone-100 truncate">{b.name}</div><div className="text-xs text-stone-400 flex items-center gap-1 mt-0.5"><MapPin size={11} /> {b.country || "—"}</div>{(b.commodities || []).length>0 && <div className="text-xs text-stone-500 mt-1">{b.commodities.join(", ")}</div>}{b.volumeInterest && <div className="text-xs text-stone-500 mt-0.5">~{b.volumeInterest}</div>}<div className="text-[10px] text-stone-600 mt-1">Owner: {userNameByKey(users,b.ownerUserId||b.originatorUserId)} · {b.relationshipSource || "Lead"}</div></div><div className="flex flex-col items-end gap-1"><Pill tone={b.stage === "Converted" ? "green" : b.stage === "Lost" ? "red" : b.stage === "Negotiating" ? "amber" : "blue"}>{b.stage}</Pill><span className="text-[9px] text-stone-600">{b.priority || "Medium"}</span></div></div>
      {(b.estimatedValue || b.probability) && <div className="grid grid-cols-2 gap-2 mt-3"><div className="bg-[#202426] rounded p-2"><div className="text-[8px] uppercase text-stone-600">Est. value</div><div className="text-xs text-stone-200">{fmtMoney(b.estimatedCurrency || "R", b.estimatedValue)}</div></div><div className="bg-[#202426] rounded p-2"><div className="text-[8px] uppercase text-stone-600">Probability</div><div className="text-xs text-stone-200">{b.probability || 0}%</div></div></div>}
      {b.nextAction && <div className={`mt-3 rounded-lg px-3 py-2 text-[11px] ${due === "overdue" ? "bg-[#B9584A]/10 border border-[#B9584A]/30 text-[#E89A8D]" : "bg-[#202426] text-stone-300"}`}><strong>Next:</strong> {b.nextAction}{b.nextActionAt ? ` · ${new Date(b.nextActionAt).toLocaleString()}` : ""}{due === "overdue" ? " · OVERDUE" : ""}</div>}
      <div className="text-[10px] text-stone-600 mt-2">{b.lastContactAt ? `Last activity ${fmtTime(b.lastContactAt)}` : "No activity logged yet"} · {acts.length} activit{acts.length===1?"y":"ies"}</div>
      <div className="flex items-center justify-between mt-4 pt-3 border-t border-[#2B2F32]"><div className="flex gap-3"><button onClick={() => setActivityTarget(b)} className="text-[11px] text-[#DB8A4E] hover:text-[#E7A874]">+ Activity</button><button onClick={() => convertToClient(b)} disabled={b.stage === "Converted"} className="text-[11px] text-[#A7C1AE] disabled:opacity-30"><Check size={11} className="inline" /> Convert</button></div><div className="flex gap-2"><button onClick={() => setModal(b)} className="text-stone-500 hover:text-stone-200"><Pencil size={14}/></button>{isManagement(user) && <button onClick={() => removeBuyer(b)} className="text-stone-500 hover:text-red-400"><Trash2 size={14}/></button>}</div></div>
    </Card>; })}</div>
    {modal && <BuyerModal editing={modal === "add" ? null : modal} user={user} users={users} onClose={() => setModal(null)} onSave={saveBuyer} />}
    {activityTarget && <ActivityModal recordName={activityTarget.name} onClose={() => setActivityTarget(null)} onSave={saveActivity} />}
  </div>;
}

function BuyerModal({ editing, user, users, onClose, onSave }) {
  const [name,setName]=useState(editing?.name||""); const [country,setCountry]=useState(editing?.country||""); const [commodities,setCommodities]=useState(editing?.commodities||[]); const [gradeInterest,setGradeInterest]=useState(editing?.gradeInterest||""); const [volumeInterest,setVolumeInterest]=useState(editing?.volumeInterest||""); const [stage,setStage]=useState(editing?.stage||BUYER_STAGES[0]); const [source,setSource]=useState(editing?.source||""); const [contactName,setContactName]=useState(editing?.contactName||""); const [contactPhone,setContactPhone]=useState(editing?.contactPhone||""); const [contactEmail,setContactEmail]=useState(editing?.contactEmail||""); const [notes,setNotes]=useState(editing?.notes||"");
  const [priority,setPriority]=useState(editing?.priority||"Medium"); const [estimatedValue,setEstimatedValue]=useState(editing?.estimatedValue||""); const [estimatedCurrency,setEstimatedCurrency]=useState(editing?.estimatedCurrency||"R"); const [probability,setProbability]=useState(editing?.probability||""); const [expectedCloseAt,setExpectedCloseAt]=useState(editing?.expectedCloseAt||""); const [nextAction,setNextAction]=useState(editing?.nextAction||""); const [nextActionAt,setNextActionAt]=useState(editing?.nextActionAt||""); const [lostReason,setLostReason]=useState(editing?.lostReason||""); const [ownerUserId,setOwnerUserId]=useState(editing?.ownerUserId||userKey(user)); const [relationshipSource,setRelationshipSource]=useState(editing?.relationshipSource||"Salesperson Introduced");
  const toggleCommodity=(c)=>setCommodities((cur)=>cur.includes(c)?cur.filter((x)=>x!==c):[...cur,c]);
  const submit=()=>onSave({name:name.trim(),country,commodities,gradeInterest,volumeInterest,stage,source,contactName,contactPhone,contactEmail,notes,priority,estimatedValue,estimatedCurrency,probability,expectedCloseAt,nextAction,nextActionAt,lostReason:stage==="Lost"?lostReason:"",ownerUserId:isManagement(user)?ownerUserId:(editing?.ownerUserId||userKey(user)),visibility:ownerUserId==="highlands"?"Management":(editing?.visibility||"Private"),relationshipSource},editing);

    {isManagement(user) && <Field label="Owner / assign to"><Select value={ownerUserId} onChange={(e)=>setOwnerUserId(e.target.value)}><option value="highlands">Highlands Pool (Management only)</option>{Object.values(users||{}).filter((u)=>u.active!==false).map((u)=><option key={u.email} value={userKey(u)}>{u.name} · {roleLabel(u)}</option>)}</Select></Field>}

    <span className="block text-xs uppercase tracking-wide text-stone-400 mb-1">Commodities of interest</span><div className="flex flex-wrap gap-1 mb-3">{COMMODITIES.filter((c)=>c!=="Other").map((c)=><button key={c} type="button" onClick={()=>toggleCommodity(c)} className={`text-[11px] px-2 py-1 rounded-full border ${commodities.includes(c)?"bg-[#C9763C] text-[#141617] border-[#C9763C]":"border-[#2B2F32] text-stone-400"}`}>{c}</button>)}</div>

    <div className="bg-[#202426] border border-[#2B2F32] rounded-lg p-3 mb-3"><div className="text-xs text-[#DB8A4E] mb-2">Next action</div><Field label="Action"><TextInput value={nextAction} onChange={(e)=>setNextAction(e.target.value)} placeholder="e.g. Send revised offer" /></Field><Field label="Due"><TextInput type="datetime-local" value={nextActionAt} onInput={(e)=>setNextActionAt(e.target.value)} onChange={(e)=>setNextActionAt(e.target.value)} /></Field></div>
    {stage==="Lost" && <Field label="Lost reason"><Select value={lostReason} onChange={(e)=>setLostReason(e.target.value)}><option value="">— select —</option>{["Price","Competitor","No stock","Wrong grade","No response","Timing","Compliance","Financing","Relationship","Other"].map((x)=><option key={x}>{x}</option>)}</Select></Field>}
    <Field label="Internal notes"><TextArea rows={3} value={notes} onChange={(e)=>setNotes(e.target.value)} /></Field>
    <div className="flex justify-end gap-2"><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn disabled={!name.trim()} onClick={submit}>{editing?"Save changes":"Add buyer lead"}</Btn></div>
  </Modal>;
}


/* ---------------- SETTINGS: Company profile & signatories ---------------- */

function SettingsTab({ settings, saveSettings, user, users, saveUsersRegistry, data, persist, log, withLog }) {
  const [company, setCompany] = useState(settings.company || { name: "", address: "", phone: "", email: "", bank: "" });
  const [sigModal, setSigModal] = useState(null); // null | 'add' | signatory object
  const [portalClientId, setPortalClientId] = useState("");
  const [portalEmail, setPortalEmail] = useState("");
  const [portalName, setPortalName] = useState("");
  const [portalRole, setPortalRole] = useState("buyer_portal");

  const saveCompany = () => {
    saveSettings({ ...settings, company });
    if (user) persist(withLog(data, log("Edited", "Settings", "Company profile")));
  };

  const saveSignatory = (form, editing) => {
    const list = settings.signatories || [];
    let next;
    if (editing) {
      next = list.map((s) => (s.id === editing.id ? { ...s, ...form } : s));
      if (user) persist(withLog(data, log("Edited", "Signatory", form.name)));
    } else {
      next = [{ ...form, id: uid("sig") }, ...list];
      if (user) persist(withLog(data, log("Added", "Signatory", form.name)));
    }
    saveSettings({ ...settings, signatories: next });
    setSigModal(null);
  };

  const removeSignatory = (s) => {
    if (!confirmDelete(`signatory ${s.name}`)) return;
    saveSettings({ ...settings, signatories: (settings.signatories || []).filter((x) => x.id !== s.id) });
    if (user) persist(withLog(data, log("Deleted", "Signatory", s.name)));
  };

  const createPortalAccess = () => {
    const email = portalEmail.trim().toLowerCase();
    const client = data.clients.find((c) => c.id === portalClientId);
    if (!client || !portalName.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert("Choose a client and enter a valid name and email.");
    const external = { name: portalName.trim(), email, title: client.name, role: portalRole, team: "External", active: true, linkedClientId: client.id };
    const nextUsers = { ...users, [email]: external };
    saveUsersRegistry(nextUsers);
    persist(withLog(data, log("Added", "Portal Access", client.name, `${portalRole === "supplier_portal" ? "Supplier" : "Buyer"} portal · ${email}`)));
    setPortalClientId(""); setPortalEmail(""); setPortalName("");
  };

  return (
    <div>
      <PageHeader eyebrow="Configuration" title="Settings" subtitle="Company profile and signatories used on generated documents" />

      <Card className="p-4 mb-5">

/* ---------------- DOCUMENTS: Pro-forma invoices & quotations ---------------- */

function DocumentsTab({ data, persist, log, withLog, settings }) {
  const [modal, setModal] = useState(null); // null | 'add' | doc object (edit) 
  const [preview, setPreview] = useState(null); // doc being previewed/printed

  const dealLabel = (id) => {
    const d = data.deals.find((x) => x.id === id);
    if (!d) return "—";
    return d.dealRef || d.clientManual || data.clients.find((c) => c.id === d.clientId)?.name || "Deal";
  };

  const save = (form, editing) => {
    let next = { ...data };
    if (editing) {
      next.genDocs = (next.genDocs || []).map((d) => (d.id === editing.id ? { ...d, ...form } : d));
      next = withLog(next, log("Edited", "Document", `${form.type} ${form.docNumber}`));
    } else {
      const doc = { ...form, id: uid("gdoc"), createdAt: new Date().toISOString() };
      next.genDocs = [doc, ...(next.genDocs || [])];
      next = withLog(next, log("Generated", "Document", `${form.type} ${form.docNumber}`));
    }
    persist(next);
    setModal(null);
  };

  const remove = (d) => {
    if (!confirmDelete(`${d.type} ${d.docNumber}`)) return;
    let next = { ...data, genDocs: (data.genDocs || []).filter((x) => x.id !== d.id) };
    next = withLog(next, log("Deleted", "Document", `${d.type} ${d.docNumber}`));
    persist(next);
  };

  const nextDocNumber = (type) => {
    const prefix = type === "Quotation" ? "QT" : "PI";
    const count = (data.genDocs || []).filter((d) => d.type === type).length + 1;
    return `${prefix}-${new Date().getFullYear()}-${String(count).padStart(3, "0")}`;
  };

  return (
    <div>
      <PageHeader
        eyebrow="Deal Structuring"
        title="Documents"
        subtitle="Generate pro-forma invoices and quotations with your logo, terms and a signatory's signature"
        action={<Btn onClick={() => setModal("add")}><Plus size={14} /> Generate Document</Btn>}
      />
      {(!settings.company?.name && (settings.signatories || []).length === 0) && (
        <Card className="p-3 mb-4 text-xs text-stone-400 flex items-center gap-2">
          <Info size={13} className="text-[#DB8A4E] flex-shrink-0" />
          Add your company profile and at least one signatory in Settings so generated documents look complete.
        </Card>
      )}
      {(data.genDocs || []).length === 0 && <EmptyState label="No pro-forma invoices or quotations generated yet." />}
      <div className="space-y-2">
        {(data.genDocs || []).map((d) => (
          <Card key={d.id} className="p-3 flex items-start justify-between">
            <div>
              <div className="text-sm font-medium text-stone-100 flex items-center gap-2">
                {d.type} <span className="mono text-stone-500">{d.docNumber}</span>
              </div>
              <div className="text-xs text-stone-400">{d.clientName || "—"} {d.dealId ? `· ${dealLabel(d.dealId)}` : ""}</div>
              <div className="text-xs text-stone-500">{d.currency}{(d.items || []).reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.unitPrice) || 0), 0).toLocaleString(undefined, { maximumFractionDigits: 2 })} · {d.date}</div>
            </div>
            <div className="flex gap-1">
              <button onClick={() => setPreview(d)} className="text-stone-500 hover:text-[#DB8A4E]" title="Preview / Print"><Printer size={14} /></button>
              <button onClick={() => setModal(d)} className="text-stone-500 hover:text-stone-200"><Pencil size={14} /></button>
              <button onClick={() => remove(d)} className="text-stone-500 hover:text-red-400"><Trash2 size={14} /></button>
            </div>
          </Card>
        ))}
      </div>
      {modal && (
        <DocumentModal
          data={data}
          settings={settings}
          editing={modal === "add" ? null : modal}
          nextDocNumber={nextDocNumber}
          onClose={() => setModal(null)}
          onSave={save}
        />
      )}
      {preview && <DocumentPreview doc={preview} settings={settings} onClose={() => setPreview(null)} />}
    </div>
  );
}

function DocumentModal({ data, settings, editing, nextDocNumber, onClose, onSave }) {
  const [type, setType] = useState(editing?.type || "Pro-forma Invoice");
  const [dealId, setDealId] = useState(editing?.dealId || "");
  const [clientName, setClientName] = useState(editing?.clientName || "");
  const [clientAddress, setClientAddress] = useState(editing?.clientAddress || "");
  const [currency, setCurrency] = useState(editing?.currency || "$");
  const [date, setDate] = useState(editing?.date || new Date().toISOString().slice(0, 10));
  const [validUntil, setValidUntil] = useState(editing?.validUntil || "");
  const [paymentTerms, setPaymentTerms] = useState(editing?.paymentTerms || "");
  const [notes, setNotes] = useState(editing?.notes || "");
  const [signatoryId, setSignatoryId] = useState(editing?.signatoryId || (settings.signatories || [])[0]?.id || "");
  const [items, setItems] = useState(
    editing?.items || [{ description: "", qty: "", unit: "MT", unitPrice: "" }]
  );

  const applyDeal = (id) => {
    setDealId(id);
    const deal = data.deals.find((d) => d.id === id);
    if (!deal) return;
    const client = data.clients.find((c) => c.id === deal.clientId);
    setClientName(deal.clientManual || client?.name || "");
    setClientAddress(client?.area || "");
    setCurrency(deal.currency || "$");
    if (client?.paymentTerms) setPaymentTerms(client.paymentTerms);
    setItems([
      {
        description: deal.mineralManual || data.minerals.find((m) => m.id === deal.mineralId)?.commodity || "Product",
        qty: deal.quantity || "",
        unit: deal.unit || "MT",
        unitPrice: deal.price || "",
      },
    ]);
  };

  const updateItem = (i, field, val) => setItems((cur) => cur.map((it, idx) => (idx === i ? { ...it, [field]: val } : it)));
  const addItem = () => setItems((cur) => [...cur, { description: "", qty: "", unit: "MT", unitPrice: "" }]);
  const removeItem = (i) => setItems((cur) => cur.filter((_, idx) => idx !== i));
  const total = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);

  const submit = () => {
    onSave(
      {
        type,
        docNumber: editing?.docNumber || nextDocNumber(type),
        dealId, clientName, clientAddress, currency, date, validUntil, paymentTerms, notes, signatoryId, items,
      },
      editing
    );
  };

  return (
    <Modal title={editing ? `Edit ${editing.type}` : "Generate Document"} onClose={onClose} wide>
      <div className="flex gap-1 mb-3">
        {["Pro-forma Invoice", "Quotation"].map((t) => (
          <button key={t} onClick={() => setType(t)} className={`text-[11px] px-2.5 py-1 rounded-full ${type === t ? "bg-[#C9763C] text-[#141617] font-medium" : "bg-[#202426] text-stone-400"}`}>{t}</button>
        ))}
      </div>

      <Field label="Pull from an existing deal (optional)">
        <Select value={dealId} onChange={(e) => applyDeal(e.target.value)}>
          <option value="">— none, enter manually —</option>
          {data.deals.map((d) => <option key={d.id} value={d.id}>{d.dealRef || d.clientManual || "Deal"}</option>)}
        </Select>
      </Field>

      <div className="grid sm:grid-cols-2 gap-2">
        <Field label="Client / buyer name"><TextInput value={clientName} onChange={(e) => setClientName(e.target.value)} /></Field>
        <Field label="Client address"><TextInput value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} /></Field>
      </div>
      <div className="grid sm:grid-cols-3 gap-2">
        <Field label="Currency"><TextInput value={currency} onChange={(e) => setCurrency(e.target.value)} /></Field>
        <Field label="Date"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Valid until"><TextInput type="date" value={validUntil} onChange={(e) => setValidUntil(e.target.value)} /></Field>
      </div>
      <Field label="Payment terms"><TextInput value={paymentTerms} onChange={(e) => setPaymentTerms(e.target.value)} placeholder="e.g. 50% deposit, balance on POD" /></Field>

      <span className="block text-xs uppercase tracking-wide text-stone-400 mb-1">Line items</span>
      <div className="space-y-2 mb-2">
        {items.map((it, i) => (
          <div key={i} className="grid grid-cols-12 gap-1.5 items-center">
            <TextInput className="col-span-5" placeholder="Description" value={it.description} onChange={(e) => updateItem(i, "description", e.target.value)} />
            <TextInput className="col-span-2" placeholder="Qty" value={it.qty} onChange={(e) => updateItem(i, "qty", e.target.value)} />
            <TextInput className="col-span-2" placeholder="Unit" value={it.unit} onChange={(e) => updateItem(i, "unit", e.target.value)} />
            <TextInput className="col-span-2" placeholder="Unit price" value={it.unitPrice} onChange={(e) => updateItem(i, "unitPrice", e.target.value)} />
            <button onClick={() => removeItem(i)} className="col-span-1 text-stone-500 hover:text-red-400 flex justify-center"><Trash2 size={13} /></button>
          </div>
        ))}
      </div>
      <Btn variant="subtle" className="mb-3" onClick={addItem}><Plus size={12} /> Add line</Btn>
      <div className="text-right text-sm text-stone-300 mb-3">Total: <span className="text-[#DB8A4E] font-medium">{currency}{total.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span></div>

      <Field label="Notes / terms"><TextArea rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>

      <Field label="Signatory">
        <Select value={signatoryId} onChange={(e) => setSignatoryId(e.target.value)}>
          <option value="">— none —</option>
          {(settings.signatories || []).map((s) => <option key={s.id} value={s.id}>{s.name} — {s.title}</option>)}
        </Select>
      </Field>
      {(settings.signatories || []).length === 0 && (
        <div className="text-[11px] text-stone-500 mb-2">No signatories on file yet — add one under Settings to sign this document.</div>
      )}

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit}>{editing ? "Save changes" : "Generate"}</Btn>
      </div>
    </Modal>
  );
}

        {signatory && (
