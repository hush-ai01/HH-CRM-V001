services:
  postgres:
    image: postgres:17
    container_name: highlands-crm-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: highlands_crm
      POSTGRES_USER: highlands
      POSTGRES_PASSWORD: highlands_dev_password

    ports:
      - "5433:5432"

    volumes:
      - highlands_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highlands -d highlands_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  highlands_postgres_data: