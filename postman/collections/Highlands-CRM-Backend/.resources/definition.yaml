$kind: collection
name: Highlands CRM Backend
description: API collection for the Highlands Holdings CRM backend. Base URL is http://localhost:8080/api/v1
variables:
  - key: baseUrl
    value: 'http://localhost:8080/api/v1'
    description: Base URL for the API
  - key: token
    value: ''
    description: JWT Bearer token obtained from login
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
