$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "companyId": "{{companyId}}",
      "email": "user@example.com",
      "password": "password123"
    }
