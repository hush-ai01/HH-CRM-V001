$kind: http-request
name: Update Calendar Event
method: PUT
url: '{{baseUrl}}/calendar/events/{{eventId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Client Meeting",
      "type": "MEETING",
      "scheduledAt": "2025-02-11T10:00:00Z",
      "notes": "Rescheduled meeting",
      "completed": false,
      "linkedEntityType": "CLIENT",
      "linkedEntityId": "{{clientId}}"
    }
